# cargo-audit configuration for the stringcheese workspace.
#
# `cargo audit` scans `Cargo.lock` against the RustSec advisory database.
# The `ignore` list below records advisories that are known to the
# workspace and are handled outside of the audit tool — either because
# they require a major-version dependency bump that is out of scope for
# a hygiene sweep, or because they are informational (unmaintained)
# rather than a live vulnerability.
#
# Every entry MUST carry a one-line rationale in the surrounding
# comment block. Rebalance this list on every wasmtime / bio /
# language-pack dep upgrade — the goal is a zero-ignore audit, not a
# permanent quiet.
#
# Format reference: https://docs.rs/cargo-audit/latest/cargo_audit/config/
[advisories]
ignore = [
    # ---------------------------------------------------------------
    # Unmaintained transitive crates — informational only, no CVE.
    #
    # atomic-polyfill (via wasmtime -> cranelift -> postcard -> heapless):
    #   Still pulled in transitively by wasmtime 47 (postcard 1.x
    #   pins heapless 0.7). heapless 0.8 drops the polyfill; wasmtime
    #   / postcard need to migrate before this clears. No CVE, dev-
    #   dep only (wasmtime is a dev-dep on the six `stringcheese-*-
    #   component` crates).
    "RUSTSEC-2023-0089",

    # custom_derive, fxhash (via bio -> stringcheese-align):
    #   bio 2.x pulls in both; bio 3.x/4.x drop them. Bio is a dev-
    #   only oracle for the `oracle-benches` feature — no impact on
    #   the shipped crate. Follow-up: bump bio in a dedicated PR.
    "RUSTSEC-2025-0058",  # custom_derive unmaintained
    "RUSTSEC-2025-0057",  # fxhash unmaintained

    # paste (via wasmtime, tokenizers, and bio-tree):
    #   Ubiquitous macro helper; upstream ecosystem is still on it.
    #   No fix path short of the ecosystem-wide migration.
    "RUSTSEC-2024-0436",
]
