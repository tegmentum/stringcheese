name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref: a quick push replaces a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Colored output plays nicely with GitHub Actions log rendering.
  CARGO_TERM_COLOR: always
  # Fail fast on any rustc warning that slipped past the workspace lint config.
  RUSTFLAGS: "-D warnings"

jobs:
  # ------------------------------------------------------------------
  # Unit, doc, and integration tests across (OS × Rust) matrix.
  # MSRV is pinned to 1.88 to match `rust-version` in Cargo.toml.
  # ------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }}, rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.rust }}

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  # ------------------------------------------------------------------
  # Clippy. `-D warnings` promotes every clippy warning to a hard failure.
  # ------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-stable

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  # ------------------------------------------------------------------
  # rustfmt. The workspace uses default formatting (no rustfmt.toml).
  # ------------------------------------------------------------------
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------
  # no_std / alloc feature check. Every crate declaring `alloc` must
  # compile both with no default features and with `--features alloc`.
  # ------------------------------------------------------------------
  no_std:
    name: no_std (alloc-capable crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: no_std-stable

      - name: Check --no-default-features and --features alloc
        # Two lists:
        #   * `pure_no_std_crates` — support the full `--no-default-features`
        #     check AND the `--no-default-features --features alloc` check.
        #     Every declaration is `no_std` by construction with no
        #     alloc-mandatory public surface.
        #   * `alloc_only_crates` — return owned `Vec`/`String` in their
        #     public API; a pure-no_std build has no sensible shape.
        #     Only the `--features alloc` variant is checked.
        # If a new crate lands, add it to whichever list matches.
        run: |
          set -euo pipefail
          pure_no_std_crates=(
            stringcheese-core
            stringcheese-corpus
            stringcheese-compare
            stringcheese-segment
            stringcheese-collate
          )
          # `stringcheese` (the facade) sits here rather than in
          # pure_no_std because it re-exports alloc-only crates
          # (stats/ident/escape/normalize/textsplit/translit/diff/
          # pattern/simhash/winnowing). A pure --no-default-features
          # build can't materialise those deps.
          alloc_only_crates=(
            stringcheese
            stringcheese-stats
            stringcheese-ident
            stringcheese-escape
            stringcheese-simhash
            stringcheese-winnowing
            stringcheese-normalize
            stringcheese-textsplit
            stringcheese-translit
            stringcheese-diff
            stringcheese-pattern
            stringcheese-ngram
            stringcheese-minhash
          )
          for crate in "${pure_no_std_crates[@]}"; do
            echo "::group::${crate} --no-default-features"
            cargo check -p "${crate}" --no-default-features --locked
            echo "::endgroup::"
            echo "::group::${crate} --no-default-features --features alloc"
            cargo check -p "${crate}" --no-default-features --features alloc --locked
            echo "::endgroup::"
          done
          for crate in "${alloc_only_crates[@]}"; do
            echo "::group::${crate} --no-default-features --features alloc"
            cargo check -p "${crate}" --no-default-features --features alloc --locked
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------
  # WebAssembly cross-compile.
  #
  # Every workspace crate that ships code (i.e. everything except the
  # `stringcheese-bench` benchmark harness and the currently-empty
  # `stringcheese-search`, `stringcheese-cdc`, `stringcheese-index` placeholder
  # crates) is verified against both wasm targets under three feature
  # configurations:
  #
  #   * `--all-features`                       — every feature enabled
  #   * `--no-default-features --features alloc` — no_std + alloc
  #   * `--no-default-features`                — pure no_std, no alloc
  #
  # That's 11 crates × 2 targets × 3 feature-sets = 66 `cargo check`
  # invocations. If a new alloc-capable crate lands, add it to `CRATES`.
  # If a new placeholder crate lands with no code, it stays out until
  # it carries an implementation.
  #
  # `wasm32-wasip1` has a real std (WASI syscalls, file I/O, timing);
  # `wasm32-unknown-unknown` has no std beyond core primitives — see
  # docs/wasm-build-recipes.md for the definitive matrix.
  #
  # `stringcheese-bench` is excluded because criterion depends on host-only
  # timing/IO machinery; benchmark-harness code is not a wasm target.
  # ------------------------------------------------------------------
  wasm:
    name: wasm cross-compile (aspirational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-stable

      - name: cargo check — full (crate × target × features) matrix
        # Two lists mirror the no_std job's split.
        # `pure_no_std_crates` get all three feature configurations
        # checked (all-features, no-default+alloc, no-default);
        # `alloc_only_crates` skip the pure-no-default variant since
        # their public API returns owned Vec/String.
        run: |
          set -euo pipefail
          pure_no_std_crates=(
            stringcheese-core
            stringcheese-corpus
            stringcheese-compare
            stringcheese-unicode
            stringcheese-phonetic
            stringcheese-segment
            stringcheese-collate
          )
          # `stringcheese` (the facade) is alloc-mandatory now that
          # it re-exports Vec/String-returning APIs from the
          # session subsystems. Only the --features alloc / --all
          # variants are checked; the pure --no-default variant is
          # skipped for the same reason as in the no_std job.
          alloc_only_crates=(
            stringcheese
            stringcheese-stats
            stringcheese-ident
            stringcheese-escape
            stringcheese-simhash
            stringcheese-winnowing
            stringcheese-normalize
            stringcheese-textsplit
            stringcheese-translit
            stringcheese-diff
            stringcheese-pattern
            stringcheese-ngram
            stringcheese-minhash
          )
          targets=(wasm32-wasip1 wasm32-unknown-unknown)
          labels=(
            "all-features"
            "no-default+alloc"
            "no-default"
          )
          flag_sets=(
            "--all-features"
            "--no-default-features --features alloc"
            "--no-default-features"
          )
          for crate in "${pure_no_std_crates[@]}"; do
            for target in "${targets[@]}"; do
              for i in 0 1 2; do
                label="${labels[$i]}"
                flags="${flag_sets[$i]}"
                echo "::group::${crate} @ ${target} [${label}]"
                # shellcheck disable=SC2086
                cargo check -p "${crate}" --target "${target}" \
                  ${flags} --locked
                echo "::endgroup::"
              done
            done
          done
          # alloc-only crates: skip the "--no-default-features" (pure
          # no_std) variant since their public API is Vec/String-heavy.
          for crate in "${alloc_only_crates[@]}"; do
            for target in "${targets[@]}"; do
              for i in 0 1; do
                label="${labels[$i]}"
                flags="${flag_sets[$i]}"
                echo "::group::${crate} @ ${target} [${label}]"
                # shellcheck disable=SC2086
                cargo check -p "${crate}" --target "${target}" \
                  ${flags} --locked
                echo "::endgroup::"
              done
            done
          done

  # ------------------------------------------------------------------
  # WebAssembly runtime tests.
  #
  # Companion to the `wasm` compile-check job above. Where `wasm` only
  # verifies `cargo check` passes for every (crate × target × feature-set)
  # combination, this job actually EXECUTES the compiled test binaries
  # under wasmtime — closing the gap called out in
  # docs/wasm-build-recipes.md ("What this matrix does not prove →
  # Runtime execution").
  #
  # The runner is configured in `.cargo/config.toml`: for
  # `--target wasm32-wasip1`, cargo invokes wasmtime with the wasm module
  # as arg 1 and passes the test-harness's own flags through.
  #
  # Scope. Every crate whose dev-deps compile on wasm32-wasip1 is
  # exercised. The proptest-gating sweep (see the block below) moved
  # `proptest` in each affected crate to
  # `[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]`, and
  # the property-test modules that use it are gated on the same
  # `#[cfg(not(target_family = "wasm"))]` predicate; host `cargo test`
  # continues to run them unchanged. Together those two moves unlocked
  # every crate below for the wasm-runtime matrix. `stringcheese-bench`
  # remains excluded — criterion depends on host-only timing / IO
  # machinery, and the benchmark harness is not a wasm target.
  #
  # If you add a new crate that pulls in `proptest`, apply the same
  # target-gating (dep + module) or its wasm test binary will fail to
  # LINK, not to run.
  #
  # `continue-on-error: true` — deliberate. Matches the pattern the
  # wave-5 `wasm` job used to start green: wasmtime install pulls from
  # https://wasmtime.dev/install.sh which is not owned by us, and a
  # transient install failure should not block PRs. Remove this once the
  # job has proven stable across a few weeks of runs.
  # ------------------------------------------------------------------
  wasm-runtime:
    name: wasm runtime tests (wasmtime, wasm32-wasip1)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-runtime-stable

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Verify wasmtime
        run: wasmtime --version

      - name: Test on wasm32-wasip1 under wasmtime
        # `--workspace --exclude stringcheese-bench` — everything else
        # in the workspace now links on wasm32-wasip1 after the
        # proptest-gating sweep. Bench is excluded because criterion
        # depends on host-only timing/IO. If a new crate lands with
        # `proptest` in unconditional `[dev-dependencies]`, move it to
        # `[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]`
        # and gate the property-test module on
        # `#[cfg(not(target_family = "wasm"))]` — or this job fails to
        # LINK.
        #
        # `stringcheese-detect` is excluded from the `--workspace`
        # invocation and tested by its own `-p` step below. Each of
        # its three backend deps (`stringcheese-detect-{script,
        # whatlang,lingua}`) gates its WIT `export!` behind a
        # per-crate `wit-component` cargo feature so the backends can
        # be linked together as `rlib` siblings inside the umbrella
        # crate without duplicate-export errors. That works crate-at-
        # a-time — but `cargo test --workspace --all-features`
        # unifies features across the whole graph, which turns
        # `wit-component` on for every backend and re-introduces the
        # duplicate exports when the umbrella's test binary tries to
        # link. Running `stringcheese-detect` in its own `-p` cargo
        # invocation keeps feature resolution scoped to the umbrella
        # crate's own manifest, which doesn't request `wit-component`
        # on any backend, so the link succeeds.
        #
        # `stringcheese-lang-gen` is a build-time codegen crate that
        # writes generated Rust to the filesystem — its tests exercise
        # that write path and trap under wasmtime's sandboxed WASI
        # filesystem view. It belongs in `[build-dependencies]` and
        # never runs in a wasm consumer's process, so excluding its
        # test suite from the wasm-runtime job is aligned with intent.
        run: |
          cargo test \
            --workspace \
            --exclude stringcheese-bench \
            --exclude stringcheese-detect \
            --exclude stringcheese-lang-gen \
            --all-features \
            --locked \
            --target wasm32-wasip1
          # Separate `-p` invocation for the detect umbrella so the
          # backend crates are linked as plain `rlib`s (no
          # `wit-component` feature) — see the note above.
          cargo test \
            -p stringcheese-detect \
            --all-features \
            --locked \
            --target wasm32-wasip1

  # ------------------------------------------------------------------
  # WebAssembly binary-size gate.
  #
  # Builds every crate that ships (or, via the size-probe wrapper at
  # `wasm-size-probes/`, could ship) a `.wasm` binary and compares the
  # `wasm-opt -Oz` output size against the baseline recorded in
  # `.wasm-size-limits.toml`. Fails the job when any measured crate
  # exceeds `optimized_bytes * (1 + tolerance_pct / 100)` — see
  # `docs/wasm-binary-size.md` for the methodology and the reason each
  # crate carries the tolerance it does.
  #
  # `wasm-opt` (from Binaryen) and `twiggy` are both pinned versions;
  # `twiggy` is `cargo install`ed once and cached via the shared
  # `~/.cargo/bin` cache. `wasm-opt` is downloaded from the Binaryen
  # release tarball (`version_<N>` naming; the linux-x86_64 tarball is
  # the officially-supported GitHub Actions shape).
  #
  # cargo-component is required to build the WIT component. It is
  # `cargo install`ed alongside twiggy; both are on the cargo-bin cache
  # and only reinstall when `TWIGGY_VERSION` / `CARGO_COMPONENT_VERSION`
  # change.
  # ------------------------------------------------------------------
  wasm-size:
    name: wasm binary-size gate
    runs-on: ubuntu-latest
    env:
      # Pinned tool versions. Bump these deliberately — every version
      # change re-optimizes the wasm output slightly and can shift the
      # baseline numbers in `.wasm-size-limits.toml` by low-single-digit
      # percentages. Coordinate a rebaseline PR when bumping either.
      BINARYEN_VERSION: "119"
      TWIGGY_VERSION: "0.7.0"
      CARGO_COMPONENT_VERSION: "0.21.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32-unknown-unknown + wasm32-wasip1)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          # `wasm32-wasip1` is the target `cargo component` currently
          # emits before wrapping into the component-model binary;
          # `wasm32-unknown-unknown` is the target every probe cdylib
          # is built against.
          targets: wasm32-unknown-unknown,wasm32-wasip1

      # Two independent caches: one for the workspace target/ (probes
      # + component builds), one for `~/.cargo/bin/` where `twiggy` and
      # `cargo-component` land. Splitting them keeps the target cache
      # invalidating on lockfile changes without also nuking the
      # slow-to-install binaries.
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-size-stable
          # `wasm-size-probes` is standalone (own Cargo.lock); include
          # it explicitly so the cache invalidates on probe-crate
          # changes too.
          workspaces: |
            .
            wasm-size-probes
            component/rust-host

      - name: Cache ~/.cargo/bin (twiggy, cargo-component)
        id: cargo-bin-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/twiggy
            ~/.cargo/bin/cargo-component
          # Bust the cache when a pinned tool version changes.
          key: cargo-bin-twiggy${{ env.TWIGGY_VERSION }}-cc${{ env.CARGO_COMPONENT_VERSION }}

      - name: Install wasm-opt (Binaryen ${{ env.BINARYEN_VERSION }})
        run: |
          set -euo pipefail
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/binaryen.tar.gz "$url"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo cp "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Install twiggy (${{ env.TWIGGY_VERSION }}) if cache miss
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        # `--locked` ensures the crate's own Cargo.lock is honored so
        # the install is reproducible across CI runs.
        run: cargo install --locked --version "${TWIGGY_VERSION}" twiggy

      - name: Install cargo-component (${{ env.CARGO_COMPONENT_VERSION }}) if cache miss
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version "${CARGO_COMPONENT_VERSION}" cargo-component

      - name: Verify tool versions
        run: |
          wasm-opt --version
          twiggy --version
          cargo-component --version

      # The gate itself. `scripts/measure-wasm-size.sh` is the single
      # source of truth for the measurement recipe — the job below
      # delegates to it rather than duplicating the loop, so the local
      # reproducer and CI stay in lockstep. Exit code 1 fails the job.
      - name: Run wasm-size gate
        run: scripts/measure-wasm-size.sh

      # On a green run, dump `twiggy top` for the two heaviest crates
      # so a reviewer skimming a passing CI can see roughly where the
      # bytes are going. Deliberately not gated on the size check —
      # this is informational.
      - name: Post-run twiggy summary (informational)
        if: success()
        run: |
          set -euo pipefail
          # `stringcheese-unicode` and `stringcheese-manip` are the two
          # heaviest as of the initial baseline; anyone re-baselining
          # heavier crates should swap the names here.
          for crate in stringcheese-unicode stringcheese-manip; do
            probe_wasm="wasm-size-probes/target/wasm32-unknown-unknown/release/wasm_size_probe.wasm"
            opt_wasm="/tmp/${crate}.opt.wasm"
            (
              cd wasm-size-probes
              cargo build --release \
                --target wasm32-unknown-unknown \
                --no-default-features \
                --features "probe-${crate}" \
                --quiet
            )
            wasm-opt -Oz -o "${opt_wasm}" "${probe_wasm}"
            echo "::group::twiggy top ${crate}"
            twiggy top "${opt_wasm}" | head -20 || true
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------
  # tiktoken parity harness (optional, non-blocking).
  #
  # Fetches OpenAI's real `mergeable_ranks` blobs from the public CDN,
  # verifies them against the SHA-256 hashes hard-coded in the
  # conformance crate, feeds them into `stringcheese-tokenizer-hf`,
  # and diffs the output against `tiktoken-rs` over a ~200-input
  # corpus. Phase 3 of the tokenizer subsystem design
  # (`docs/design/tokenizers.md` § 11); the harness lives in
  # `crates/stringcheese-tokenizer-tiktoken-conformance/`, which is
  # DELIBERATELY EXCLUDED from the top-level workspace so its
  # network-dependent `parity-real-vocab` feature never leaks into
  # `cargo test --workspace --all-features`.
  #
  # `continue-on-error: true` — the OpenAI CDN is not owned by us; a
  # transient outage or hash rotation should not wedge PRs. When the
  # parity harness reaches steady state (Phase 4/5), promote this to
  # blocking.
  #
  # `TIKTOKEN_PARITY_STRICT=1` — a divergence between
  # stringcheese-tokenizer-hf and tiktoken-rs becomes a hard test
  # failure on this job (the default posture is "report, don't
  # gate"). Combined with `continue-on-error: true` at the job level,
  # a real regression surfaces as a red mark on the job without
  # failing the workflow.
  # ------------------------------------------------------------------
  tiktoken-parity:
    name: tiktoken parity (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          # The conformance crate lives in its own workspace root
          # (empty `[workspace]` at the top of its Cargo.toml — see the
          # crate's README for the rationale). Include its `target/`
          # in the cache alongside the main workspace's.
          workspaces: |
            .
            crates/stringcheese-tokenizer-tiktoken-conformance
          key: tiktoken-parity-stable

      - name: Cache vocab blobs
        uses: actions/cache@v4
        with:
          path: ~/.cache/stringcheese-tokenizer-tiktoken
          # Bust the cache only when the hash constants in
          # variant.rs change — CDN rotations then re-verify on the
          # next run.
          key: tiktoken-vocabs-${{ hashFiles('crates/stringcheese-tokenizer-tiktoken-conformance/src/variant.rs') }}

      - name: Run parity harness (cl100k_base + o200k_base)
        env:
          TIKTOKEN_PARITY_STRICT: "1"
        run: |
          cargo test \
            --manifest-path crates/stringcheese-tokenizer-tiktoken-conformance/Cargo.toml \
            --features parity-real-vocab \
            --locked \
            -- --nocapture

  # ------------------------------------------------------------------
  # rustdoc. Any broken intra-doc link or dead link fails the build.
  # ------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: docs-stable

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
