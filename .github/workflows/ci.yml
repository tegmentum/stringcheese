name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref: a quick push replaces a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Colored output plays nicely with GitHub Actions log rendering.
  CARGO_TERM_COLOR: always
  # Fail fast on any rustc warning that slipped past the workspace lint config.
  RUSTFLAGS: "-D warnings"

jobs:
  # ------------------------------------------------------------------
  # Unit, doc, and integration tests across (OS × Rust) matrix.
  # MSRV is pinned to 1.85 to match `rust-version` in Cargo.toml.
  # ------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }}, rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.rust }}

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  # ------------------------------------------------------------------
  # Clippy. `-D warnings` promotes every clippy warning to a hard failure.
  # ------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-stable

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  # ------------------------------------------------------------------
  # rustfmt. The workspace uses default formatting (no rustfmt.toml).
  # ------------------------------------------------------------------
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------
  # no_std / alloc feature check. Every crate declaring `alloc` must
  # compile both with no default features and with `--features alloc`.
  # ------------------------------------------------------------------
  no_std:
    name: no_std (alloc-capable crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: no_std-stable

      - name: Check --no-default-features and --features alloc
        # Every crate below declares an `alloc` cargo feature that gates
        # heap-allocating types. If a new alloc-gated crate lands, add it
        # here. (The placeholder crates in the workspace also declare
        # `alloc` today but hold no code; they are intentionally excluded
        # from this list until they carry implementations worth checking.)
        run: |
          set -euo pipefail
          crates=(
            stringcheese-core
            stringcheese-corpus
            stringcheese-compare
            stringcheese
          )
          for crate in "${crates[@]}"; do
            echo "::group::${crate} --no-default-features"
            cargo check -p "${crate}" --no-default-features --locked
            echo "::endgroup::"
            echo "::group::${crate} --no-default-features --features alloc"
            cargo check -p "${crate}" --no-default-features --features alloc --locked
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------
  # WebAssembly cross-compile.
  #
  # Every workspace crate that ships code (i.e. everything except the
  # `stringcheese-bench` benchmark harness and the currently-empty
  # `stringcheese-search`, `stringcheese-cdc`, `stringcheese-index` placeholder
  # crates) is verified against both wasm targets under three feature
  # configurations:
  #
  #   * `--all-features`                       — every feature enabled
  #   * `--no-default-features --features alloc` — no_std + alloc
  #   * `--no-default-features`                — pure no_std, no alloc
  #
  # That's 11 crates × 2 targets × 3 feature-sets = 66 `cargo check`
  # invocations. If a new alloc-capable crate lands, add it to `CRATES`.
  # If a new placeholder crate lands with no code, it stays out until
  # it carries an implementation.
  #
  # `wasm32-wasip1` has a real std (WASI syscalls, file I/O, timing);
  # `wasm32-unknown-unknown` has no std beyond core primitives — see
  # docs/wasm-build-recipes.md for the definitive matrix.
  #
  # `stringcheese-bench` is excluded because criterion depends on host-only
  # timing/IO machinery; benchmark-harness code is not a wasm target.
  # ------------------------------------------------------------------
  wasm:
    name: wasm cross-compile (aspirational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-stable

      - name: cargo check — full (crate × target × features) matrix
        run: |
          set -euo pipefail
          crates=(
            stringcheese
            stringcheese-core
            stringcheese-corpus
            stringcheese-compare
            stringcheese-unicode
            stringcheese-phonetic
          )
          targets=(wasm32-wasip1 wasm32-unknown-unknown)
          # Feature-set label -> flag string. Kept as parallel arrays so
          # the loop below stays legible.
          labels=(
            "all-features"
            "no-default+alloc"
            "no-default"
          )
          flag_sets=(
            "--all-features"
            "--no-default-features --features alloc"
            "--no-default-features"
          )
          for crate in "${crates[@]}"; do
            for target in "${targets[@]}"; do
              for i in 0 1 2; do
                label="${labels[$i]}"
                flags="${flag_sets[$i]}"
                echo "::group::${crate} @ ${target} [${label}]"
                # shellcheck disable=SC2086
                cargo check -p "${crate}" --target "${target}" \
                  ${flags} --locked
                echo "::endgroup::"
              done
            done
          done

  # ------------------------------------------------------------------
  # WebAssembly runtime tests.
  #
  # Companion to the `wasm` compile-check job above. Where `wasm` only
  # verifies `cargo check` passes for every (crate × target × feature-set)
  # combination, this job actually EXECUTES the compiled test binaries
  # under wasmtime — closing the gap called out in
  # docs/wasm-build-recipes.md ("What this matrix does not prove →
  # Runtime execution").
  #
  # The runner is configured in `.cargo/config.toml`: for
  # `--target wasm32-wasip1`, cargo invokes wasmtime with the wasm module
  # as arg 1 and passes the test-harness's own flags through.
  #
  # Scope. Every crate whose dev-deps compile on wasm32-wasip1 is
  # exercised. The proptest-gating sweep (see the block below) moved
  # `proptest` in each affected crate to
  # `[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]`, and
  # the property-test modules that use it are gated on the same
  # `#[cfg(not(target_family = "wasm"))]` predicate; host `cargo test`
  # continues to run them unchanged. Together those two moves unlocked
  # every crate below for the wasm-runtime matrix. `stringcheese-bench`
  # remains excluded — criterion depends on host-only timing / IO
  # machinery, and the benchmark harness is not a wasm target.
  #
  # If you add a new crate that pulls in `proptest`, apply the same
  # target-gating (dep + module) or its wasm test binary will fail to
  # LINK, not to run.
  #
  # `continue-on-error: true` — deliberate. Matches the pattern the
  # wave-5 `wasm` job used to start green: wasmtime install pulls from
  # https://wasmtime.dev/install.sh which is not owned by us, and a
  # transient install failure should not block PRs. Remove this once the
  # job has proven stable across a few weeks of runs.
  # ------------------------------------------------------------------
  wasm-runtime:
    name: wasm runtime tests (wasmtime, wasm32-wasip1)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-runtime-stable

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Verify wasmtime
        run: wasmtime --version

      - name: Test on wasm32-wasip1 under wasmtime
        # `--workspace --exclude stringcheese-bench` — everything else
        # in the workspace now links on wasm32-wasip1 after the
        # proptest-gating sweep. Bench is excluded because criterion
        # depends on host-only timing/IO. If a new crate lands with
        # `proptest` in unconditional `[dev-dependencies]`, move it to
        # `[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]`
        # and gate the property-test module on
        # `#[cfg(not(target_family = "wasm"))]` — or this job fails to
        # LINK.
        run: |
          cargo test \
            --workspace \
            --exclude stringcheese-bench \
            --all-features \
            --locked \
            --target wasm32-wasip1

  # ------------------------------------------------------------------
  # rustdoc. Any broken intra-doc link or dead link fails the build.
  # ------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          key: docs-stable

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
