[package]
name = "stringcheese-sr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Serbian language pack for the StringCheese toolkit: dual-script (Cyrillic Vukovica + Latin Gaj) stopword lists (~200 entries), bijective Vukovica <-> Gaj's-Latin transliteration, Snowball-family Serbian stemmer that normalizes to Latin internally, whitespace-and-punctuation tokenizer that treats both scripts as word characters, and a `to_latin`-backed phonetic hookup. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["serbian", "stemmer", "snowball", "stopwords", "cyrillic"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The Snowball
# stemmer builds owned `String` output, `Language::tokenize` hands back
# a `Box<dyn Iterator>`, the script transliteration returns owned
# `String` output, and the phonetic encoder returns an owned `String`
# key — all `alloc`-only. Without this feature the crate compiles down
# to the stopword slices and the module constants alone (enough to
# link against on embedded targets that only want the tables).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Opt in to the cross-Slavic `SlavicMetaphone` sound-alike encoder from
# `stringcheese-phonetic` as an alternate phonetic encoder alongside the
# default Cyrillic-to-Latin `SerbianLatin` transliteration. Off by
# default so callers who only want the transliteration pay no cost for
# the shared Slavic family encoder's tables; on by opt-in via
# `SERBIAN_WITH_SLAVIC_METAPHONE` (or
# `Serbian::with_slavic_metaphone_encoder`). Requires `alloc` because
# the encoder returns owned `String` keys.
slavic-metaphone = ["alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
