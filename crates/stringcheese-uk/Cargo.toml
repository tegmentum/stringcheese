[package]
name = "stringcheese-uk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ukrainian language pack for the StringCheese toolkit: ~220-word Cyrillic stopword list, light suffix-stripping Ukrainian stemmer (there is no reference Snowball Ukrainian algorithm — the module strips common nominal / adjectival / verbal suffixes on `Vec<char>` indices), apostrophe-aware whitespace-and-punctuation tokenizer (word-internal `'` U+0027 is preserved as it marks hardness in words like `сім'я`), and a GOST 7.79 System B transliteration adapter tailored to the Ukrainian letter set (`є → ye`, `і → i`, `ї → yi`, `ґ → g`, `г → h`). Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["ukrainian", "stemmer", "stopwords", "cyrillic", "transliteration"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The stemmer
# builds owned `String` output, `Language::tokenize` hands back a
# `Box<dyn Iterator>`, and the transliteration encoder returns an owned
# `String` key — all `alloc`-only. Without this feature the crate
# compiles down to the stopword slice and the module constants alone
# (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
