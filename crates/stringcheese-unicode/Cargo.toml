[package]
name = "stringcheese-unicode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unicode preprocessing (normalization, case folding, grapheme handling) for the StringCheese sequence-comparison toolkit."
categories = ["algorithms", "text-processing", "internationalization"]
keywords = ["comparison", "unicode", "normalization", "grapheme"]

[features]
# The default set preserves the crate's full pre-split surface — a
# casual caller who writes `stringcheese-unicode = "0.1"` still gets
# `case_fold`, `simple_case_fold`, `case_fold_turkic`, the full
# [`PreprocessingPipeline`] surface, and the baked-in ICU data all
# working out of the box. Backwards-compat matters.
default = ["std", "case-fold", "compiled-case-data", "word-segmentation", "sentence-segmentation", "line-breaking"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = [
    "alloc",
    "stringcheese-core/std",
    "unicode-normalization/std",
]
# When enabled, the crate may use heap-allocating types (`String`, `Vec`, …)
# from `alloc`. The entire public surface (normalization, case folding,
# grapheme segmentation, diacritic stripping, preprocessing pipeline)
# returns owned strings and is gated behind this feature. Without it, the
# crate compiles as an empty no-alloc surface for embedded builds that
# only need to link against the substrate crates.
alloc = ["stringcheese-core/alloc"]
# Enables the [`case_folding`] module and its `icu_casemap` dependency.
# Without this feature the module (and every `pub use` at the crate
# root that comes from it) is omitted entirely, dropping `icu_casemap`
# and its transitive ICU4X data crates from the build. Size-conscious
# wasm callers who only need normalization + graphemes + diacritic
# stripping can disable this to shave roughly 110 KB off the
# `wasm-opt -Oz` binary.
case-fold = ["dep:icu_casemap"]
# Bakes the Unicode case-mapping tables into the binary via
# `icu_casemap/compiled_data`, so the zero-arg convenience
# entry points (`case_fold`, `simple_case_fold`, `case_fold_turkic`)
# and the [`PreprocessingStep::CaseFold`] pipeline variant work with
# no runtime data-provider setup. This is the historical behavior and
# is on by default.
#
# When disabled (but `case-fold` is still enabled), the crate exposes
# only the `_with_mapper` variants that take a caller-supplied
# [`icu_casemap::CaseMapper`]; the caller is then responsible for
# constructing the mapper from an `icu_provider::DataProvider` (from a
# file, a network fetch, or an embedded `include_bytes!` of the ICU
# data blob). This trades convenience for a substantially smaller
# binary — the compiled ICU tables account for roughly half of the
# crate's default `wasm-opt -Oz` footprint.
compiled-case-data = ["case-fold", "icu_casemap/compiled_data"]
# Enables the [`words`] module — UAX #29 word segmentation. Wraps the
# `unicode-segmentation` crate's `UnicodeWords` and `UWordBounds`
# iterators plus a `WordSequence` type indexable in `O(1)`. Turning
# this feature off drops the module and the associated `Word_Break`
# tables that `unicode-segmentation` pulls into a linked wasm build;
# a size-conscious caller who only needs graphemes / normalization
# should shed it.
word-segmentation = []
# Enables the [`sentences`] module — UAX #29 sentence segmentation.
# Wraps `unicode-segmentation`'s `UnicodeSentences` iterator plus a
# `SentenceSequence` type indexable in `O(1)`. Toggle independently
# from `word-segmentation` so callers can pay for exactly the
# `Sentence_Break` / `Word_Break` tables they actually reach.
sentence-segmentation = []
# Enables the [`line_breaks`] module — UAX #14 line-breaking algorithm.
# Wraps the `unicode-linebreak` crate's `linebreaks` iterator plus a
# materialized [`LineBreakSequence`] indexable in `O(1)`. Pulls in
# the `unicode-linebreak` dependency and its `Line_Break` property
# table (~22 KB in a `wasm-opt -Oz` build over the minimum-useful
# surface baseline). Independently toggleable from
# `word-segmentation` / `sentence-segmentation` so callers can pay
# for exactly the segmentation surfaces they reach — a caller that
# only needs word-wrapping opportunities can enable `line-breaking`
# alone.
line-breaking = ["dep:unicode-linebreak"]

[dependencies]
stringcheese-core = { workspace = true }

# Unicode data crates. All three are widely used, actively maintained, and
# have `no_std + alloc` builds; default features are disabled to avoid
# pulling in `std` transitively for embedded consumers.
#
# `unicode-normalization` — NFC/NFD/NFKC/NFKD and the `is_combining_mark`
#     lookup used by diacritic stripping.
unicode-normalization = { version = "0.1", default-features = false }
# `unicode-segmentation` — grapheme-cluster iteration per UAX #29.
unicode-segmentation = { version = "1", default-features = false, features = ["no_std"] }
# `icu_casemap` — full Unicode case folding (including multi-character
#     expansions such as ß → ss that simple per-char folding cannot express).
#     Optional and gated on the `case-fold` feature so a size-conscious
#     build can drop the crate — and its ~30 transitive ICU4X crates —
#     entirely. `compiled_data` is toggled by the `compiled-case-data`
#     feature; see the feature table above.
icu_casemap = { version = "1", default-features = false, optional = true }
# `unicode-linebreak` — UAX #14 line-break opportunity detection.
#     Small (`#![no_std]`) single-purpose crate from `axelf4/unicode-
#     linebreak`, tracking Unicode 15.0.0. Preferred over `xi-unicode`
#     for three reasons: (1) its `BreakOpportunity` enum
#     (`Mandatory` / `Allowed`) is a 1:1 match for the `LineBreak`
#     surface this crate exposes, so no lossy mapping layer is needed;
#     (2) it is explicitly `#![no_std]` with no `std`/`alloc` feature
#     required at all, matching this crate's `no_std + alloc` posture;
#     (3) `xi-unicode` is a byproduct of the archived `xi-editor`
#     project and is no longer under active maintenance. Optional and
#     gated on the `line-breaking` feature so size-conscious wasm
#     callers who do not need the Line_Break table can shed the
#     dependency entirely.
unicode-linebreak = { version = "0.1", optional = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
