[package]
name = "stringcheese-icu-segment-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reference WebAssembly component packaging for the StringCheese ICU-alternative break-iteration capability. Wraps `stringcheese-icu-segment`'s `BreakEngine` behind the shared `tegmentum:i18n-segment@0.1.0` WIT contract, feature-gated so a component-model host can load the segmenter through the standard `segment-world` exports while callers of the plain `rlib` avoid any wit-bindgen-rt symbol collisions. Phase 5 ships the algorithm crate's built-in UAX #29 default classification tables + rule state machines, so the shipped .wasm is drivable end-to-end without loading any external SCUD pack."
categories = ["text-processing", "internationalization", "wasm"]
keywords = ["segmentation", "icu", "uax29", "wasm", "component-model"]

[lib]
# Dual-target: `rlib` for Rust callers (unit tests, host-side
# embedding), `cdylib` for the WIT component build produced by
# `cargo build --target wasm32-wasip1 --features wit-component`.
crate-type = ["cdylib", "rlib"]

[features]
# `alloc` is required unconditionally — the WIT `segment-world`
# exports functions that return owned `Vec<u32>`s and
# `Vec<WordSegment>`s, and the `BreakEngine` the guest wraps is
# `alloc`-only. `std` is enabled by default for parity with the
# rest of the WIT-i18n subsystem.
default = ["std"]
std = ["stringcheese-icu-segment/std"]

# `wit-component` opts into the WIT `Guest` implementations and the
# `export!` invocation that turns this crate into a standalone
# `tegmentum:i18n-segment@0.1.0` WASM component. Off by default so
# the crate can be linked as a plain `rlib` sibling of other WIT
# components without every backend emitting the same exported
# symbols and tripping the linker with duplicate-export errors —
# matches the pattern established by
# `stringcheese-tokenizer-component`,
# `stringcheese-icu-case-component`,
# `stringcheese-icu-collation-component`, and
# `stringcheese-icu-datetime-component`. Enable this only for the
# standalone-component build produced by
# `cargo build --target wasm32-wasip1 --features wit-component`.
wit-component = ["std", "dep:wit-bindgen-rt"]

[dependencies]
# The segment algorithm crate. Provides `BreakEngine`, `WordSegment`,
# and the UAX #29 default classification tables + rule state machines
# the guest delegates to.
stringcheese-icu-segment = { workspace = true, features = ["alloc"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# Pulled in only when the `wit-component` feature is enabled — see
# the feature docs above. `optional = true` keeps it off the
# dependency tree for non-component wasm consumers. Version + feature
# set pinned in lockstep with the other icu-*-component crates so a
# workspace-wide wit-bindgen bump lands in one place.
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"], optional = true }

[dev-dependencies]
# `wit-parser` gives a strong "the WIT file parses cleanly" gate
# that does not require the wasm toolchain to be present. Matches
# the smoke test that already lives in `stringcheese-icu-segment`
# and mirrors the sibling icu-*-component crates.
wit-parser = "0.230"

# `wasmtime` drives the in-process component runtime the smoke
# tests in `tests/component_smoke.rs` invoke each of the WIT
# exports through. Feature-pinned to the minimal set the tests
# need (`runtime` + `cranelift` + `component-model` + `std`) —
# same trimmed shape as `stringcheese-icu-datetime-component`.
wasmtime = { version = "26", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

# Companion crate that ships the WASI preview2 host implementations
# behind `add_to_linker_sync`. The segment component does no I/O
# of its own, but the wasip1 -> wasip2 adapter applied at
# componentize time introduces a `wasi:*@0.2.x` import surface
# that the linker must satisfy before `instantiate` will succeed.
wasmtime-wasi = { version = "26", default-features = false }

[lints]
workspace = true
