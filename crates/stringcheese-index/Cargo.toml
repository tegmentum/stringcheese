[package]
name = "stringcheese-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Index structures (BK-tree, VP-tree, q-gram inverted) for large-scale sequence matching with the StringCheese toolkit."
categories = ["algorithms", "data-structures"]
keywords = ["bk-tree", "vp-tree", "q-gram", "index", "search"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "stringcheese-core/std"]
# When enabled, the crate may use heap-allocating types from `alloc`. Every
# index structure in this crate requires this; without it the crate compiles
# as an empty no-alloc surface for embedded builds that only need to link
# against the substrate crates.
alloc = ["stringcheese-core/alloc"]

[dependencies]
stringcheese-core = { workspace = true }

[dev-dependencies]
stringcheese-corpus = { workspace = true, features = ["alloc"] }
# A true metric (Levenshtein) to build BK-tree and VP-tree golden fixtures
# against, and a documented semimetric (OSA / Damerau) used by the
# "reject non-metric" tests. Both live in `stringcheese-compare`.
stringcheese-compare = { workspace = true, features = ["std"] }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
