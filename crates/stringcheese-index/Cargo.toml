[package]
name = "stringcheese-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Index structures (BK-tree, VP-tree, q-gram inverted) for large-scale sequence matching with the StringCheese toolkit."
categories = ["algorithms", "data-structures"]
keywords = ["bk-tree", "vp-tree", "q-gram", "index", "search"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "stringcheese-core/std"]
# When enabled, the crate may use heap-allocating types from `alloc`. Every
# index structure in this crate requires this; without it the crate compiles
# as an empty no-alloc surface for embedded builds that only need to link
# against the substrate crates.
alloc = ["stringcheese-core/alloc"]

[dependencies]
stringcheese-core = { workspace = true }

[dev-dependencies]
stringcheese-corpus = { workspace = true, features = ["alloc"] }
# A true metric (Levenshtein) to build BK-tree and VP-tree golden fixtures
# against, and a documented semimetric (OSA / Damerau) used by the
# "reject non-metric" tests. Both live in `stringcheese-compare`.
stringcheese-compare = { workspace = true, features = ["std"] }
# Baseline candidate-generation throughput benches. Shares the same
# workspace-pinned criterion version as every other bench-adopting
# crate.
criterion = { workspace = true }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

# `harness = false` tells cargo not to link the built-in `libtest`
# harness — criterion supplies its own `criterion_main!` entry point.
# See `benches/index.rs` for the run recipe and the baseline numbers
# table.
[[bench]]
name = "index"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
