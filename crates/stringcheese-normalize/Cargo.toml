[package]
name = "stringcheese-normalize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Named normalization pipelines for the StringCheese toolkit. Wraps `stringcheese-unicode` for the ICU-backed primitives (NFC/NFKC/case-fold/diacritic-strip) and adds small in-house pieces (whitespace collapse, punctuation canonicalisation, control-char stripping). Exposes the pipelines callers actually want — `identifier`, `display_safe`, `search_key`, `punctuation_canonical` — rather than making every caller re-derive the right composition. Every pipeline documents its exact stage order because normalization stages don't commute in general."
categories = ["text-processing", "internationalization"]
keywords = ["normalization", "unicode", "nfc", "nfkc", "case-fold"]

[features]
default = ["std"]
std = ["alloc", "stringcheese-unicode/std"]
alloc = ["stringcheese-unicode/alloc"]

[dependencies]
# Provides the ICU-backed heavy lifting (NFC/NFKC/case-fold/
# strip-diacritics). This crate composes it into named pipelines.
stringcheese-unicode = { workspace = true, features = ["case-fold", "compiled-case-data"] }

[dev-dependencies]
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version. See `benches/normalize.rs` for the
# groups it drives and the baseline table under the crate-level `//!`
# docs for last-measured numbers.
criterion = { workspace = true }

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-normalize`. Baseline numbers live in the crate-level
# `//!` docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "normalize"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
