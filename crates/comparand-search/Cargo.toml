[package]
name = "comparand-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Substring search algorithms (Rabin-Karp, KMP, Boyer-Moore, Aho-Corasick) for the Comparand sequence-comparison toolkit."
categories = ["algorithms", "text-processing"]
keywords = ["search", "substring", "rabin-karp", "kmp", "aho-corasick"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "comparand-core/std"]
# The search algorithms allocate `Vec<Match>` results and `Vec`-backed
# preprocessing tables (KMP failure function, Boyer-Moore bad-character
# table, Aho-Corasick trie). All algorithm modules are gated on this
# feature; a pure `core` build (with neither `std` nor `alloc`) compiles
# only the trait surface in `api`.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
comparand-corpus = { workspace = true, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
