[package]
name = "stringcheese-detect-lingua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tier-2 high-accuracy language detection for the StringCheese detection stack. Wraps `lingua-rs` behind the shared tegmentum:lang-detect@0.2.0 WIT contract, with per-language Cargo features so each build embeds only the language models the caller asked for. Intended to be built once per language and shipped as an opt-in WASM component hosts fetch when whatlang's confidence (tier 1) is below their threshold."
categories = ["text-processing", "internationalization", "wasm"]
keywords = ["language-detection", "lingua", "wasm", "wit"]

[lib]
# Dual-target: `rlib` for Rust callers, `cdylib` for the WIT component
# build. One cdylib per feature-selected language pair.
crate-type = ["cdylib", "rlib"]

[features]
# One feature per language. Each activates lingua's matching
# `<lang>-language-model` crate (4–6 MB of FST-embedded ngrams per
# language) and adds that language to the detector's candidate set.
#
# Lingua's `LanguageDetectorBuilder` requires **at least two
# languages** to distinguish between — a build with a single
# feature enabled will fail lingua's runtime assertion. In practice
# a per-language tier-2 build enables `<lang>` + `english`;
# English serves as the universal comparator (every "is this
# really <lang>?" verification runs against English as the fallback
# candidate). Callers who need pure single-language confidence
# scores use `compute_language_confidence` directly, which
# lingua exposes even for the anchor pair.
#
# Lingua's internal exhaustive matches over `Language` require
# at least one language variant to compile, so an empty-features
# build is a lingua-side error, not a design choice we can make.
# The default here enables `en` + `de` — the minimum lingua accepts
# and the pair every tier-2 "non-English pack" would ship anyway
# (see the "English as anchor" note in src/lib.rs). Browser
# consumers who want lean single-language builds pass
# `--no-default-features --features <lang>,en` explicitly.
default = ["en", "de"]

# Internal marker feature: activated by every per-language feature.
# The crate's lingua-touching code sits behind
# `#[cfg(feature = "_any-lang")]`; when zero language features are
# enabled (e.g. a `cargo build --workspace --no-default-features`
# strips this crate's `en`+`de` defaults) the lingua dependency is
# omitted entirely and the public API degrades to no-op stubs.
#
# This exists because lingua-1.8.0's `Language` enum is uninhabited
# with no language features enabled, and its `iso_code_639_1` /
# `iso_code_639_3` methods contain `match self { ... }` bodies whose
# arms are all `#[cfg(feature = "<lang>")]`-gated. An uninhabited
# enum reached through `&Language` is still considered inhabited by
# rustc (references never satisfy uninhabitedness), so those bodies
# fail `E0004: non-exhaustive patterns` — a lingua-upstream bug that
# only surfaces when every language feature is off. Making lingua
# optional here keeps that unreachable code out of the crate graph
# in the zero-language configuration.
_any-lang = []

en = ["_any-lang", "dep:lingua", "lingua/english"]
de = ["_any-lang", "dep:lingua", "lingua/german"]
fr = ["_any-lang", "dep:lingua", "lingua/french"]
es = ["_any-lang", "dep:lingua", "lingua/spanish"]
it = ["_any-lang", "dep:lingua", "lingua/italian"]
pt = ["_any-lang", "dep:lingua", "lingua/portuguese"]
ja = ["_any-lang", "dep:lingua", "lingua/japanese"]
ru = ["_any-lang", "dep:lingua", "lingua/russian"]

# `wit-component` opts into the WIT `Guest` implementation and the
# `export!` invocation that turns this crate into a standalone
# `tegmentum:lang-detect@0.2.0` WASM component. Off by default so
# the crate can be linked as a plain `rlib` sibling of other detect
# backends (e.g. by the `stringcheese-detect` umbrella) without
# every backend emitting the same exported symbols and tripping the
# linker with duplicate-export errors. Enable this only for the
# standalone-component build produced by `cargo component build`.
wit-component = ["dep:wit-bindgen-rt"]

[dependencies]
# lingua is the higher-accuracy language detector — larger per-
# language footprint than whatlang (~4–6 MB each vs whatlang's
# 3–5 KB per language) in exchange for meaningfully better
# accuracy on short inputs and closely-related language pairs.
# Apache-2.0 licensed. `default-features = false` disables every
# language model; per-`<lang>` features above pull in exactly the
# ones the crate asked for.
#
# `optional = true` because lingua-1.8.0 fails to compile at all when
# zero language features are enabled — see the `_any-lang` note under
# `[features]`. Every per-language feature (`en`, `de`, …) pulls the
# `dep:lingua` marker along with `lingua/<lang>`, so lingua is present
# exactly when there is a language for it to model.
lingua = { version = "1.8", default-features = false, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Pulled in only when the `wit-component` feature is enabled — see the
# feature docs above. `optional = true` keeps it off the dependency
# tree for non-component wasm consumers, including the
# `stringcheese-detect` umbrella that links this crate as a plain
# `rlib` alongside the other detect backends.
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"], optional = true }

[package.metadata.component]
package = "tegmentum:stringcheese-detect-lingua"

[package.metadata.component.target]
path = "../../wit"
world = "lang-detect"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
