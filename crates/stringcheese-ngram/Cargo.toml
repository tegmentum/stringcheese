[package]
name = "stringcheese-ngram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sliding-window n-gram generation for the StringCheese toolkit. Character grams (over Unicode code points), byte grams, token grams (shingles over a word list), and grapheme grams (behind the `graphemes` feature). Every constructor names the semantic unit explicitly — no silent choice between bytes and code points. Feeds `stringcheese-index`, `stringcheese-compare`, and any similarity / fingerprint pipeline."
categories = ["text-processing", "algorithms"]
keywords = ["ngram", "shingle", "sliding-window", "text-similarity", "unicode"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

# Grapheme-cluster n-grams via ICU4X. Delegates to
# `stringcheese-segment/icu`. Without this feature grapheme grams
# are unavailable (constructor returns None); character and byte
# grams work regardless.
graphemes = ["stringcheese-segment/icu", "std"]

[dependencies]
stringcheese-segment = { workspace = true, optional = true }

[dev-dependencies]
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version. See `benches/ngram.rs` for the groups
# it drives and the baseline table under the crate-level `//!` docs
# for last-measured numbers.
criterion = { workspace = true }

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-ngram`. Baseline numbers live in the crate-level `//!`
# docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "ngram"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
