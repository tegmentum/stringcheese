[package]
name = "stringcheese-ngram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "N-gram representation layer (character, byte, token) for the StringCheese sequence-comparison toolkit."
categories = ["algorithms", "text-processing"]
keywords = ["ngram", "shingle", "text-processing", "comparison"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
# `l2_norm` and `normalize_l2` on `GramVector` require `std` because
# `f64::sqrt` is not in `core`; `l2_norm_squared` remains available in
# every configuration.
std = ["alloc", "stringcheese-core/std"]
# When enabled, the crate exposes its full public surface (all generators
# and the three gram representations). Without `alloc` the public surface
# is empty — see the crate-level docs for the rationale.
alloc = ["stringcheese-core/alloc"]

[dependencies]
stringcheese-core = { workspace = true }

[dev-dependencies]
# Golden-case schema; test-only.
stringcheese-corpus = { workspace = true, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
