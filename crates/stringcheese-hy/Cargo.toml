[package]
name = "stringcheese-hy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Armenian (Eastern Armenian, Republic of Armenia standard) language pack for the StringCheese toolkit: ~55-entry Armenian-script stopword list, longest-match suffix stripper covering all seven Eastern Armenian cases (nominative-definite -ը/-ն, genitive -ի, dative -ին, ablative -ից, instrumental -ով, locative -ում), plural markers (-եր monosyllabic / -ներ polysyllabic), the postposed definite article (-ը after consonant, -ն after vowel), and the aorist personal endings (-եցի / -եցիր / -եց / -եցինք / -եցիք / -եցին), whitespace-and-punctuation tokenizer that recognizes Armenian punctuation (։ full stop, ՝ comma, ՞ question, ՜ exclamation, ֊ hyphen), and a PHONEX-Armenian phonetic adapter over a Hübschmann-Meillet-inspired Armenian → Latin fold. First Armenian-script pack; Indo-European isolate branch (parallel to Greek). Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["armenian", "stemmer", "stopwords", "phonex", "eastern-armenian"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The stemmer
# builds owned `String` output, `Language::tokenize` hands back a
# `Box<dyn Iterator>`, and the phonetic encoder returns an owned
# `String` key — all `alloc`-only. Without this feature the crate
# compiles down to the stopword slice and the module constants alone
# (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
