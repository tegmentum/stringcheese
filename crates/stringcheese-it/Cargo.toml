[package]
name = "stringcheese-it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Italian language pack for the StringCheese toolkit: ~30-word MVP stopword list, identity stemmer, simple word tokenizer, and the Phase 3 CLDR-derived plural + number SCUD packs. Implements stringcheese-lang::Language. Snowball Italian stemmer and Italian phonetic encoder are documented follow-ups."
categories = ["text-processing", "internationalization"]
keywords = ["italian", "italiano", "stopwords", "plural", "number"]
build = "build.rs"

# Ship the build.rs so downstream can regenerate SCUD packs.
include = [
    "build.rs",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std"]
# When enabled, the crate exposes its full public surface.
# `Language::tokenize` hands back a `Box<dyn Iterator>` — `alloc`-only.
# Without this feature the crate compiles down to the stopword slice
# and the module constants alone (enough to link against on embedded
# targets that only want the stopword table).
alloc = ["stringcheese-lang/alloc"]
# Ship the plural-it.scud pack (WIT-i18n Phase 3 plural-rule data
# for Italian cardinals and ordinals). Adds a `plural_data` module
# exposing `PLURAL_IT_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_plural::PluralPack`. Off by
# default so callers that only want the stopword list do not pull
# in the plural crate. Requires the plural crate's `std` feature
# because plural classification uses `f64::trunc` / `f64::abs`.
plural-scud = ["dep:stringcheese-icu-plural", "stringcheese-icu-plural/std"]
# Ship the number-it.scud pack (WIT-i18n Phase 3 number-formatting
# data for Italian). Adds a `number_data` module exposing
# `NUMBER_IT_SCUD: &'static [u8]` and a helper for constructing a
# `stringcheese_icu_number::NumberPack`.
number-scud = ["dep:stringcheese-icu-number", "stringcheese-icu-number/std"]

[dependencies]
stringcheese-lang = { workspace = true }
# WIT-i18n plural / number capability crates. Optional; pulled in
# under the corresponding `-scud` features.
stringcheese-icu-plural = { workspace = true, optional = true }
stringcheese-icu-number = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the plural-it / number-it SCUD packs. Emits
# blobs into `$OUT_DIR/{plural,number}-it.scud`; the crate's
# `plural_data` / `number_data` modules `include_bytes!`-es them back
# at compile time. `stringcheese-scud` is a build-dep (not a runtime
# dep) because the writer is only used during codegen — the shipped
# binary contains only the encoded blob, not the writer machinery.
stringcheese-scud = { workspace = true, features = ["alloc"] }
# Build-time re-use of the plural crate's `PluralRuleId` opcodes and
# the per-locale helper functions in `builder::` (avoids re-encoding
# rule ids by their raw u8 in every language pack). Runtime dep is
# separately gated behind the `plural-scud` feature.
stringcheese-icu-plural = { workspace = true, features = ["std"] }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
