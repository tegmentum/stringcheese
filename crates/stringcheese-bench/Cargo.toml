[package]
name = "stringcheese-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Benchmark suite and comparative-reporting harness for the StringCheese sequence-comparison toolkit."
publish = false

[features]
default = ["std"]
std = []
# Opt-in allocation-counting harness. Installs `dhat::Alloc` as the global
# allocator in the `alloc_report_*` binaries — it must NOT be enabled for a
# regular `cargo bench` run because dhat records every allocation in the
# process and both skews criterion samples and invalidates its statistical
# model. Kept off by default; each `alloc_report_*` binary opts in via
# `required-features = ["alloc-tracking"]`.
alloc-tracking = ["dep:dhat"]

[dependencies]
stringcheese-core = { workspace = true, features = ["std"] }
# `simd` enables the Myers 1999 bit-parallel Levenshtein backend so the
# benchmark suite can measure it against the scalar rolling-rows kernel.
# `stringcheese-compare` still ships with SIMD off by default; the bench
# crate is publish = false, so opting in here does not affect downstream.
stringcheese-compare = { workspace = true, features = ["std", "simd"] }
# Newer sketch / pattern / segmentation crates that landed after the
# original bench set. Bench modules under `benches/` exercise these to
# track performance regressions across the sliding-window +
# fingerprint pipelines LLM callers actually assemble.
stringcheese-ngram = { workspace = true, features = ["std"] }
stringcheese-minhash = { workspace = true, features = ["std"] }
stringcheese-simhash = { workspace = true, features = ["std"] }
stringcheese-winnowing = { workspace = true, features = ["std"] }
stringcheese-pattern = { workspace = true, features = ["std"] }
stringcheese-diff = { workspace = true, features = ["std"] }
stringcheese-collate = { workspace = true, features = ["std"] }
stringcheese-stats = { workspace = true, features = ["std"] }
stringcheese-escape = { workspace = true, features = ["std"] }
stringcheese-textsplit = { workspace = true, features = ["std"] }
stringcheese-normalize = { workspace = true, features = ["std"] }
stringcheese-ident = { workspace = true, features = ["std"] }
# CDC + rolling-hash fingerprints. `simd` opts into the arch-gated
# `digest_of_slice` backends the CDC bench measures — the bench crate
# is publish = false, so opting in here does not affect downstream.
stringcheese-cdc = { workspace = true, features = ["std", "simd"] }
# BPE encoder throughput benches — measures the merge-table lookup
# cost inside the O(n log n) merge loop, which dominates encode time
# per the crate's design doc (§11).
stringcheese-tokenizer-bpe = { workspace = true, features = ["std"] }
stringcheese-tokenizer = { workspace = true, features = ["std"] }
# Optional so the default build does not link the heap profiler and the
# criterion benches never inherit its global allocator.
dhat = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "levenshtein"
harness = false

[[bench]]
name = "hamming"
harness = false

[[bench]]
name = "jaro"
harness = false

[[bench]]
name = "damerau"
harness = false

[[bench]]
name = "ngram"
harness = false

[[bench]]
name = "batch"
harness = false

# Sketch construction and comparison — MinHash + SimHash + winnowing.
# All three share a common shape (feed hashed grams from ngram; get a
# comparable fingerprint back) so this bench measures the pipeline
# LLM RAG callers care about, not the underlying primitives in
# isolation.
[[bench]]
name = "sketches"
harness = false

# Pattern-matching throughput — literal (memchr) vs wildcard vs glob
# on realistic haystacks. The wildcard/glob path wraps globset+regex
# so this catches regressions in either the wrap layer or in the
# underlying crates.
[[bench]]
name = "pattern"
harness = false

# Diff — Myers + Patience side-by-side at four input scales. The
# diff crate's algo.rs carries an at-risk revisit trigger:
# "replace with wrap of `similar` if no benchmark-tracked perf
# work lands within 2-3 arcs." This bench discharges that trigger.
[[bench]]
name = "diff"
harness = false

# Collate — UCA (feruca) vs Natural (wraps any inner) vs ASCII-CI
# (byte-level fast path). Three implementations behind one trait
# should show orders-of-magnitude differences on ASCII input,
# validating the "pick the right collator for your input" note in
# the crate's module docs.
[[bench]]
name = "collate"
harness = false

# Stats — all-in-house characterisation primitives. Bench measures
# per-character-iteration overhead directly (no wrap layer to
# amortise across).
[[bench]]
name = "stats"
harness = false

# Escape — four targets side-by-side. Three wrap crates
# (percent-encoding, html-escape, shlex); one in-house (JSON
# string body). The in-house JSON's cost vs the wraps is the
# interesting datapoint — validates or challenges the "avoid
# serde_json footprint" rationale in the crate's json module.
[[bench]]
name = "escape"
harness = false

# Textsplit — recursive splitter has the most complex algorithm
# in the session's new crates (separator-list recursion + hard-cut
# fallback + greedy merge + overlap). Bench captures per-splitter
# throughput at three chunk sizes and three input sizes so
# regressions on the recursive OR merge path surface loudly.
[[bench]]
name = "textsplit"
harness = false

# Normalize — named pipelines are compositions of primitives.
# Bench measures which pipeline dominates which primitive so the
# per-preset cost is legible when a caller has to pick.
[[bench]]
name = "normalize"
harness = false

# Ident — three surfaces: heck-backed case conversion, deunicode-
# backed slugify, in-house sanitize. Bench measures each so wrap-
# costs vs in-house are directly comparable.
[[bench]]
name = "ident"
harness = false

# CDC + rolling-hash fingerprints — FastCDC boundary throughput at
# two paper-derived configs, plus the four rolling-hash slice-batch
# entry points and the per-byte trait-driven Gear-hash loop. The
# fingerprint benches exercise whichever SIMD backend the dispatcher
# picks (AVX2 / SSE2 on x86_64, NEON on aarch64, SIMD128 on wasm32).
[[bench]]
name = "cdc"
harness = false

# BPE — measures encode throughput on a ~10 KiB English-prose corpus
# with a byte-alphabet vocab and a few thousand synthetic merges plus
# a batch of registered special tokens. The dominant cost inside the
# merge loop is `BpeMergeTable::rank`; this bench tracks its
# representation across refactors (BTreeMap → HashMap).
[[bench]]
name = "bpe"
harness = false

# Allocation-report binaries. Each one is gated on the `alloc-tracking`
# feature so that a default build never sees dhat's global allocator; the
# feature has to be requested explicitly at `cargo run` time.
[[bin]]
name = "alloc_report_levenshtein"
path = "src/bin/alloc_report_levenshtein.rs"
required-features = ["alloc-tracking"]

[[bin]]
name = "alloc_report_osa"
path = "src/bin/alloc_report_osa.rs"
required-features = ["alloc-tracking"]

[[bin]]
name = "alloc_report_damerau"
path = "src/bin/alloc_report_damerau.rs"
required-features = ["alloc-tracking"]

[[bin]]
name = "alloc_report_ngram"
path = "src/bin/alloc_report_ngram.rs"
required-features = ["alloc-tracking"]

[lints]
workspace = true
