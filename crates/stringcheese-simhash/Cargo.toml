[package]
name = "stringcheese-simhash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SimHash fingerprints and Hamming-distance similarity for the StringCheese toolkit. Feed any `Hash` feature (character n-grams, token shingles, tf-idf-weighted words) into a fixed-width sketch; compare two sketches for a cosine-similar signal at 64-bit or 128-bit resolution. Sibling of stringcheese-minhash — SimHash answers 'how similar are these two weighted-feature bags?' where MinHash answers 'how similar are these two SETS?'."
categories = ["algorithms", "text-processing"]
keywords = ["simhash", "fingerprint", "near-duplicate", "hamming", "sketch"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
# Same rationale as stringcheese-minhash — seedable, portable
# non-crypto hasher. `RandomState::hash_one` gives us a stable
# 64-bit hash per feature without dragging in a full crypto dep.
ahash = { version = "0.8", default-features = false }

[dev-dependencies]
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version. See `benches/simhash.rs` for the
# groups it drives and the baseline table under the crate-level `//!`
# docs for last-measured numbers.
criterion = { workspace = true }

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-simhash`. Baseline numbers live in the crate-level `//!`
# docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "simhash"
harness = false

[lints]
workspace = true
