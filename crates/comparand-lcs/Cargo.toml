[package]
name = "comparand-lcs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Longest Common Subsequence and LCS distance for the Comparand sequence-comparison toolkit."
categories = ["algorithms", "text-processing", "no-std"]
keywords = ["lcs", "distance", "comparison", "wasm"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "comparand-core/std"]
# When enabled, the crate may use heap-allocating types from `alloc`. The
# workspace and every dynamic-programming kernel in this crate require this;
# without it the crate compiles as an empty no-alloc surface for embedded
# builds that only need to link against the substrate crates.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
comparand-corpus = { workspace = true, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
