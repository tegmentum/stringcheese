[package]
name = "stringcheese-mk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Macedonian language pack for the StringCheese toolkit: ~70-word Cyrillic stopword list, lightweight rule-based Macedonian stemmer with three-way postposed definite-article stripping (proximal -ов/-ва/-во/-ве, medial -от/-та/-то/-те, distal -он/-на/-но/-не — Macedonian's signature morphological feature), plural / verb / adjective suffix passes, whitespace-and-punctuation tokenizer, and a PHONEX-mk Soundex-shape phonetic encoder that maps the Macedonian-specific letters (ѓ ќ љ њ џ ѕ ј) to consonant classes. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["macedonian", "stemmer", "stopwords", "cyrillic", "phonex"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The stemmer
# builds owned `String` output, `Language::tokenize` hands back a
# `Box<dyn Iterator>`, and the PHONEX encoder returns an owned `String`
# key — all `alloc`-only. Without this feature the crate compiles down
# to the stopword slice and the module constants alone (enough to link
# against on embedded targets that only want the stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
