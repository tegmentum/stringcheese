[package]
name = "stringcheese-scud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "StringCheese Unicode Data (SCUD) file-format loader — the shared per-locale data-pack substrate for the stringcheese-icu-* WIT capability crates. Parses the SCUD header (magic, format version, CLDR version, capability tag, locale), then hands out zero-copy per-capability views into the file body. Phase 1 of the WIT-i18n subsystem (docs/design/wit-i18n.md § 4)."
categories = ["text-processing", "internationalization", "encoding"]
keywords = ["scud", "cldr", "unicode", "i18n", "wit"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
# Adds `ScudFile::open(path)` for on-disk loading; the `include_bytes!`
# entrypoint (`from_static`) is always available.
std = ["alloc"]
# When enabled, the crate exposes owned-loader helpers built on `Vec<u8>`.
# The zero-copy `from_static(&'static [u8])` path is available under
# `no_std` without either feature enabled.
alloc = []

[dependencies]

[dev-dependencies]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
