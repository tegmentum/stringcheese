[package]
name = "stringcheese-ar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Arabic language pack for the StringCheese toolkit: ~150-word stopword list, Larkey ALP light10 stemmer (Larkey, Ballesteros, Connell 2002), diacritic / alef / yeh / teh-marbuta normalizer, Buckwalter transliteration phonetic hookup, and a whitespace-based simple tokenizer. Implements stringcheese-lang::Language. First right-to-left-script pack."
categories = ["text-processing", "internationalization"]
keywords = ["arabic", "stemmer", "buckwalter", "larkey", "stopwords"]
build = "build.rs"

# Ship the build.rs so downstream can regenerate SCUD packs against
# the shipped rules.
include = [
    "build.rs",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The Larkey
# light10 stemmer builds owned `String` output, `Language::tokenize`
# hands back a `Box<dyn Iterator>`, the normalizer allocates, and the
# Buckwalter transliterator returns an owned `String` key — all
# `alloc`-only. Without this feature the crate compiles down to the
# stopword slice and the module constants alone (enough to link
# against on embedded targets that only want the stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Ship the plural-ar.scud pack (WIT-i18n Phase 3 plural-rule data
# for Arabic cardinals — the maximum six-category set: zero/one/two/
# few/many plus the implicit `other` fallback). Adds a `plural_data`
# module exposing `PLURAL_AR_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_plural::PluralPack`. Requires the
# plural crate's `std` feature because plural classification uses
# `f64::trunc` / `f64::abs`.
plural-scud = ["dep:stringcheese-icu-plural", "stringcheese-icu-plural/std"]
# Ship the number-ar.scud pack (WIT-i18n Phase 3 number-formatting
# data for Arabic — Latin `latn` numbering system, Western digits;
# Arabic-Indic `arab` / `arabext` digit shapes and RTL bidi are
# deferred). Adds a `number_data` module exposing `NUMBER_AR_SCUD:
# &'static [u8]` and a helper for constructing a
# `stringcheese_icu_number::NumberPack`.
number-scud = ["dep:stringcheese-icu-number", "stringcheese-icu-number/std"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# WIT-i18n plural / number capability crates. Optional; pulled in
# under the corresponding `-scud` features.
stringcheese-icu-plural = { workspace = true, optional = true }
stringcheese-icu-number = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the plural-ar / number-ar SCUD packs.
stringcheese-scud = { workspace = true, features = ["alloc"] }
# Build-time re-use of the plural crate's `PluralRuleId` opcodes and
# per-locale helper functions.
stringcheese-icu-plural = { workspace = true, features = ["std"] }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
