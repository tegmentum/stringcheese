[package]
name = "stringcheese"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rigorous sequence comparison for Rust and WebAssembly — distance, similarity, alignment, phonetic, n-gram, fingerprinting, and chunking algorithms."
categories = ["algorithms", "text-processing"]
keywords = ["comparison", "distance", "similarity", "levenshtein", "phonetic"]

[features]
default = ["std"]
std = [
    "stringcheese-core/std",
    "stringcheese-compare/std",
    "stringcheese-manip/std",
    "stringcheese-unicode/std",
    "stringcheese-phonetic/std",
    "stringcheese-cdc/std",
    "stringcheese-index/std",
    "stringcheese-align/std",
    "stringcheese-lang/std",
    "stringcheese-tokenizer/std",
    "stringcheese-segment/std",
    "stringcheese-stats/std",
    "stringcheese-ident/std",
    "stringcheese-escape/std",
    "stringcheese-simhash/std",
    "stringcheese-winnowing/std",
    "stringcheese-normalize/std",
    "stringcheese-textsplit/std",
    "stringcheese-collate/std",
    "stringcheese-translit/std",
    "stringcheese-diff/std",
    "stringcheese-pattern/std",
]

# Opt-in regex engine — pulls the `regex` crate's finite-automata
# backend under `stringcheese-pattern-regex`. Off by default: the
# facade's default install stays lean; callers who want regex
# matching flip this feature (or take a direct dep on
# `stringcheese-pattern-regex`).
pattern-regex = ["dep:stringcheese-pattern-regex"]
alloc = [
    "stringcheese-core/alloc",
    "stringcheese-compare/alloc",
    "stringcheese-manip/alloc",
    "stringcheese-unicode/alloc",
    "stringcheese-phonetic/alloc",
    "stringcheese-cdc/alloc",
    "stringcheese-index/alloc",
    "stringcheese-align/alloc",
    "stringcheese-lang/alloc",
    "stringcheese-tokenizer/alloc",
    "stringcheese-segment/alloc",
    "stringcheese-stats/alloc",
    "stringcheese-ident/alloc",
    "stringcheese-escape/alloc",
    "stringcheese-simhash/alloc",
    "stringcheese-winnowing/alloc",
    "stringcheese-normalize/alloc",
    "stringcheese-textsplit/alloc",
    "stringcheese-collate/alloc",
    "stringcheese-translit/alloc",
    "stringcheese-diff/alloc",
    "stringcheese-pattern/alloc",
]

[dependencies]
stringcheese-core = { workspace = true }
stringcheese-compare = { workspace = true }
stringcheese-manip = { workspace = true }
stringcheese-unicode = { workspace = true }
stringcheese-phonetic = { workspace = true }
stringcheese-cdc = { workspace = true }
stringcheese-index = { workspace = true }
stringcheese-align = { workspace = true }
# Language-pack infrastructure. Per-language packs (`stringcheese-en`,
# etc.) are opt-in and NOT re-exported by this facade — callers pick
# languages by direct dependency.
stringcheese-lang = { workspace = true }
# Tokenizer/segmenter trait crate + built-in tokenizers. Downstream
# algorithm crates (`stringcheese-tokenizer-hf`, planned `-wordpiece`
# and `-sentencepiece`) and pre-configured model packs (`-tiktoken`,
# `-huggingface`) are opt-in per the umbrella pattern.
stringcheese-tokenizer = { workspace = true }
# Subsystems added after the original 10 crates — segmentation,
# stats, identifiers, escape, three fingerprint sketches (simhash /
# winnowing; the standalone stringcheese-minhash / -ngram crates
# stay direct-dep to avoid colliding with the compare-crate
# implementations already re-exported), normalization presets,
# text splitters, collation, transliteration, diff, and pattern
# matching. Detection crates stay direct-dep too — a caller who
# doesn't need language detection shouldn't pay for the trigram
# tables.
stringcheese-segment = { workspace = true }
stringcheese-stats = { workspace = true }
stringcheese-ident = { workspace = true }
stringcheese-escape = { workspace = true }
stringcheese-simhash = { workspace = true }
stringcheese-winnowing = { workspace = true }
stringcheese-normalize = { workspace = true }
stringcheese-textsplit = { workspace = true }
stringcheese-collate = { workspace = true }
stringcheese-translit = { workspace = true }
stringcheese-diff = { workspace = true }
stringcheese-pattern = { workspace = true }
# Opt-in via the `pattern-regex` feature — non-trivial regex-engine
# data footprint that leaner callers shouldn't pay for by default.
stringcheese-pattern-regex = { workspace = true, optional = true }

[dev-dependencies]
# Not re-exported through the facade (both collide with the older
# minhash / ngram modules baked into stringcheese-compare) but
# needed by integration tests that exercise the newer standalone
# crates alongside the facade's other subsystems. Enable `std`
# so the tests can rely on the standard `Vec` / `HashMap` surface
# — the workspace-level dep declares `default-features = false`.
stringcheese-minhash = { workspace = true, features = ["std"] }
stringcheese-ngram = { workspace = true, features = ["std"] }

# WIT-i18n subsystem crates + a handful of language packs — pulled in
# as dev-dependencies so the umbrella-crate example programs under
# `examples/` can demonstrate the case-mapping, collation, plural,
# number, datetime, and word-segmentation capabilities end-to-end.
# The umbrella itself does NOT re-export these crates (see the
# `stringcheese-icu-*` deferrals in `src/lib.rs`); example code
# reaches for them under their own crate names, mirroring the shape a
# real caller would use.
stringcheese-icu-case = { workspace = true, features = ["alloc"] }
stringcheese-icu-collation = { workspace = true, features = ["alloc"] }
stringcheese-icu-plural = { workspace = true, features = ["std"] }
stringcheese-icu-number = { workspace = true, features = ["std"] }
stringcheese-icu-datetime = { workspace = true, features = ["std"] }
stringcheese-icu-segment = { workspace = true, features = ["std"] }
stringcheese-en = { workspace = true, features = [
    "case-scud",
    "collation-scud",
    "plural-scud",
    "number-scud",
    "datetime-scud",
] }
stringcheese-de = { workspace = true, features = [
    "case-scud",
    "collation-scud",
    "number-scud",
    "datetime-scud",
] }
stringcheese-tr = { workspace = true, features = ["case-scud"] }
stringcheese-fr = { workspace = true, features = ["number-scud"] }
stringcheese-ru = { workspace = true, features = ["plural-scud"] }
stringcheese-ar = { workspace = true, features = [
    "plural-scud",
    "number-scud",
] }
stringcheese-ja = { workspace = true, features = [
    "datetime-scud",
    "break-scud",
] }

[lints]
workspace = true
