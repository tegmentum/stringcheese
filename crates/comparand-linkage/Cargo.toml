[package]
name = "comparand-linkage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Probabilistic record linkage (Fellegi-Sunter model) for the Comparand sequence-comparison toolkit."
categories = ["algorithms", "data-structures"]
keywords = ["record-linkage", "fellegi-sunter", "entity-resolution", "matching"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
# The log-likelihood weight computation depends on `f64::log2`, which lives
# in `std` — a `no_std` build (with or without `alloc`) therefore compiles
# the crate as an empty surface. See the crate-level `no_std` section for
# a longer discussion of this design choice.
std = ["alloc", "comparand-core/std"]
# When enabled, the crate may use heap-allocating types from `alloc`. Present
# for symmetry with the rest of the workspace's feature matrix; the actual
# computational API is behind `std` because `f64::log2` requires the standard
# library.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
comparand-corpus = { workspace = true, features = ["alloc"] }
comparand-jaro = { workspace = true, features = ["std"] }
proptest = "1"

[lints]
workspace = true
