[package]
name = "stringcheese-lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Language-pack infrastructure for the StringCheese toolkit: the Language trait, Stemmer / Collator / LanguagePhoneticEncoder plugin points, and shared helper types (Stopwords, SimpleTokenizer) that the per-language stringcheese-<lang> crates plug into."
categories = ["text-processing", "internationalization", "no-std"]
keywords = ["language", "stemming", "stopwords", "tokenizer", "phonetic"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "stringcheese-core/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. Every trait
# object surface (`Language::stem` returns `Cow<'_, str>`; `tokenize`
# returns `Box<dyn Iterator>`; `phonetic_encoder` returns
# `Option<&dyn LanguagePhoneticEncoder>` with String keys) depends on
# heap-allocating types from `alloc`. Without this feature the crate
# compiles down to the borrow-only helpers (`Stopwords`,
# `SimpleTokenizer`) — enough to link against on embedded targets
# that only want the case-insensitive stopword membership check.
alloc = ["stringcheese-core/alloc", "stringcheese-phonetic/alloc"]

[dependencies]
stringcheese-core = { workspace = true }
# `stringcheese-phonetic` is the sanctioned home of `PhoneticEncoder`
# (and its concrete Soundex / NYSIIS / Double Metaphone encoders); the
# language-pack contract exposes phonetic encoding via a type-erased
# wrapper trait defined here, and stringcheese-<lang> crates adapt the
# phonetic crate's encoders through it.
stringcheese-phonetic = { workspace = true }
# `linkme` powers the language-pack `registry` — a distributed slice
# each `stringcheese-<lang>` pack opts into via the exported
# `register_language!` macro. Chosen over `inventory` because it is
# `no_std`-compatible (matches this crate's `no_std + alloc` target),
# collects at link time with zero runtime constructor cost (no `ctor`
# / `Lazy` init-order dance), and re-exports cleanly under a private
# path so downstream packs need no direct `linkme` dependency of
# their own.
linkme = "0.3"

[dev-dependencies]
# The three shipped language packs are pulled in as dev-deps so
# `tests/registry_integration.rs` can prove all three self-register
# into the distributed slice at link time. The pack crates are the
# integration test's only reason to be in the dev graph — they are
# NOT runtime dependencies of stringcheese-lang, and pulling them in
# outside `[dev-dependencies]` would break the "callers pay only for
# the languages they want" commitment recorded in the crate docs.
#
# `default-features = true` (i.e. `std`, which pulls in `alloc`) is
# required for the integration test — the pack constants
# (`ENGLISH`, `GERMAN`, `FRENCH`) and the `Language` trait's
# `stem` / `tokenize` methods live behind the `alloc` gate.
stringcheese-en = { workspace = true, default-features = true }
stringcheese-de = { workspace = true, default-features = true }
stringcheese-fr = { workspace = true, default-features = true }

# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
