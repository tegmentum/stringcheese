[package]
name = "stringcheese-tr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Turkish language pack for the StringCheese toolkit: ~180-word stopword list, Snowball Turkish (Eryiğit & Adalı 2004) stemmer with vowel-harmony-aware suffix stripping, Turkic-case-aware simple tokenizer (dotted/dotless-I), and a light PHONEX-Turkish phonetic hookup. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["turkish", "stemmer", "snowball", "stopwords", "vowel-harmony"]
build = "build.rs"

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The Snowball
# stemmer builds owned `String` output, `Language::tokenize` hands back
# a `Box<dyn Iterator>`, and the phonetic encoder returns an owned
# `String` key — all `alloc`-only. Without this feature the crate
# compiles down to the stopword slice and the module constants alone
# (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Ship the case-tr.scud pack (WIT-i18n Phase 1 case-mapping data for
# Turkish). Adds a `case_data` module exposing `CASE_TR_SCUD:
# &'static [u8]` and a helper constructing a
# `stringcheese_icu_case::CasePack`. The pack carries the Turkish
# dotted / dotless-I contextual mappings (I → ı, i → İ) that are the
# whole point of the second locale in Phase 1 — cross-locale
# composition (English + Turkish) proves that per-locale packs win
# over the fallback chain. See docs/design/wit-i18n.md § 6.
#
# The `stringcheese-icu-case/alloc` toggle matches the shape used by
# `stringcheese-en`; without it the CasePack helper is stripped by
# the workspace's default-features=false posture.
case-scud = ["dep:stringcheese-icu-case", "stringcheese-icu-case/alloc"]
# Ship the collation-tr.scud pack (WIT-i18n Phase 2 collation
# tailoring data for Turkish). Adds a `collation_data` module
# exposing `COLLATION_TR_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_collation::CollationPack`.
#
# Turkish's primary-distinct dotted-i / dotless-ı ordering (`... h
# ı i j ...`) is a **documented Phase 2 CollationEngine deferral**
# — the shipped engine's primary_fold ASCII-lowercases and then
# delegates to feruca (CLDR-root), where `i` and `ı` share a
# primary weight. The pack still ships options + a small
# expansion table (ß → ss, so a Turkish text quoting a German
# loanword collates identically to the English/German packs).
# See `docs/design/wit-i18n.md` § 8.2 for the deferral rationale.
collation-scud = ["dep:stringcheese-icu-collation", "stringcheese-icu-collation/alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
stringcheese-icu-case = { workspace = true, optional = true }
stringcheese-icu-collation = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the case-tr.scud pack. Same shape as
# `stringcheese-en/build.rs` — the SCUD writer runs at build time
# and drops out of the shipped binary; only the encoded blob rides
# along.
stringcheese-scud = { workspace = true, features = ["alloc"] }

[dev-dependencies]

# WIT-i18n cross-locale composition test: exercises an
# `[en_pack, tr_pack]` CaseEngine to prove per-locale packs override
# the fallback chain. Only in dev-deps — the shipped `stringcheese-tr`
# rlib never depends on `stringcheese-en`.
stringcheese-en = { workspace = true, features = ["case-scud"] }
stringcheese-icu-case = { workspace = true, features = ["alloc"] }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
