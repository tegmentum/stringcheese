[package]
name = "comparand-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Index structures (BK-tree, VP-tree, q-gram inverted) for large-scale sequence matching with the Comparand toolkit."
categories = ["algorithms", "data-structures"]
keywords = ["bk-tree", "vp-tree", "q-gram", "index", "search"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "comparand-core/std"]
# When enabled, the crate may use heap-allocating types from `alloc`. Every
# index structure in this crate requires this; without it the crate compiles
# as an empty no-alloc surface for embedded builds that only need to link
# against the substrate crates.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
comparand-corpus = { workspace = true, features = ["alloc"] }
# A true metric to build BK-tree and VP-tree golden fixtures against.
comparand-levenshtein = { workspace = true, features = ["std"] }
# A documented semimetric (OSA) used by the "reject non-metric" tests.
comparand-damerau = { workspace = true, features = ["std"] }
proptest = "1"

[lints]
workspace = true
