[package]
name = "stringcheese-icu-plural"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Plural-rules capability of the StringCheese ICU alternative. Classifies a number under CLDR plural rules (cardinal + ordinal) using per-locale data supplied through one or more `stringcheese-scud` plural packs, and exposes the result through the `tegmentum:i18n-plural@0.1.0` WIT world. Phase 3 of the WIT-i18n subsystem (docs/design/wit-i18n.md § 8.3)."
categories = ["text-processing", "internationalization"]
keywords = ["plural", "icu", "cldr", "i18n", "unicode"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-scud/std"]
# When enabled, the crate exposes the full plural-engine API. Without
# this feature the crate compiles down to the pack-descriptor types
# alone.
alloc = ["stringcheese-scud/alloc"]

[dependencies]
stringcheese-scud = { workspace = true }

[dev-dependencies]
# `wit-parser` provides a strong "the WIT file parses cleanly" gate
# that does not need the wasm toolchain to be installed. Matches
# the `stringcheese-icu-case` crate's approach.
wit-parser = "0.230"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
