[package]
name = "stringcheese-cdc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Content-defined chunking (FastCDC) and rolling-hash fingerprints (Rabin, polynomial, Gear) for the StringCheese toolkit."
categories = ["algorithms", "compression"]
keywords = ["cdc", "fastcdc", "chunking", "rabin", "rolling-hash"]

[features]
default = ["std"]
# Enables the standard library. Implies `alloc`. Without this feature the
# crate compiles as `#![no_std]`.
std = ["alloc", "stringcheese-core/std"]
# Enables heap-allocating utilities such as the `Vec`-returning helper on
# `FastCdc`. Kernels, iterators, and the `RollingHash` trait itself are
# available in a pure no-alloc build.
alloc = ["stringcheese-core/alloc"]
# Enables the SIMD backends for the rolling-hash fingerprints under
# `fingerprint::<hash>::simd`. Off by default because the arch-gated
# `#[target_feature]` scaffolding is only meaningful on `x86_64`,
# `aarch64`, and `wasm32+simd128`; every backend is byte-identical to
# the corresponding scalar `RollingHash::roll` sequence and is
# differentially tested against it. No external dependencies —
# intrinsics are consumed from `core::arch` only. Implies `std`
# because runtime CPU-feature detection on `x86_64` and `aarch64` goes
# through `std::arch::is_*_feature_detected!` (there is no
# `core::arch` equivalent stable today); the `wasm32+simd128` path
# gates on a compile-time `cfg` and does not need it, but the feature
# is unified for API-surface consistency. This matches the shape
# `stringcheese-compare`'s `simd` feature declares.
simd = ["std"]
# When enabled, the criterion bench harness pulls in best-in-class Rust
# CDC / rolling-hash oracle crates (`fastcdc` for the FastCDC end-to-end
# chunker; `gearhash` for the dedicated GEAR rolling hash) and adds
# side-by-side oracle-comparison bench groups. The feature is off by
# default because it is bench-only: no library code looks at either
# oracle crate, and the ordinary `cargo bench -p stringcheese-cdc`
# invocation must keep working without pulling either extra crate. See
# `benches/cdc.rs` for the gated groups and `docs/perf/cdc-oracle-gaps.md`
# for the last-measured gap table. Mirrors the shape
# `stringcheese-compare` / `stringcheese-align` use.
oracle-benches = ["dep:fastcdc", "dep:gearhash"]

[dependencies]
stringcheese-core = { workspace = true }
# --- optional oracle-comparison bench deps -------------------------------
#
# `fastcdc` (4) — Nathan Fiedler's canonical Rust FastCDC implementation.
# Reference for the FastCDC end-to-end chunker throughput. Zero transitive
# deps beyond the crate itself. `gearhash` (0.1) — dedicated GEAR
# rolling-hash crate, reference for scalar per-byte GEAR throughput and
# (on x86_64 AVX2 / SSE4.2) the SIMD `next_match` throughput. On aarch64
# `gearhash` falls back to its scalar loop — no NEON backend upstream —
# so the "simd" lane there is a scalar-vs-scalar comparison; documented
# in `benches/cdc.rs`. Pulls only `cfg-if` transitively.
#
# Both are marked `optional = true` and gated by the `oracle-benches`
# feature; a plain `cargo build` / `cargo test` / `cargo bench` never
# pulls them in. They live in `[dependencies]` (not `[dev-dependencies]`)
# because Cargo does not allow optional dev-deps, and both crates are
# small enough that the additional Cargo.lock entries are cheap (~3
# packages including transitive `cfg-if`, well under the 20-entry budget
# documented in `docs/perf/oracle-gap-summary.md`).
fastcdc = { version = "4", optional = true }
gearhash = { version = "0.1", optional = true }

[dev-dependencies]
stringcheese-corpus = { workspace = true, features = ["alloc"] }
# Baseline throughput benches. `criterion` version is pinned at the
# workspace level so every bench-adopting crate shares one version.
criterion = { workspace = true }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

# `harness = false` tells cargo not to link the built-in `libtest`
# harness — criterion supplies its own `criterion_main!` entry point.
# See `benches/cdc.rs` for the run recipe and the baseline numbers
# table.
[[bench]]
name = "cdc"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
