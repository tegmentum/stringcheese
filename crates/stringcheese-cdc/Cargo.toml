[package]
name = "stringcheese-cdc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Content-defined chunking (FastCDC) and rolling-hash fingerprints (Rabin, polynomial, Gear) for the StringCheese toolkit."
categories = ["algorithms", "compression"]
keywords = ["cdc", "fastcdc", "chunking", "rabin", "rolling-hash"]

[features]
default = ["std"]
# Enables the standard library. Implies `alloc`. Without this feature the
# crate compiles as `#![no_std]`.
std = ["alloc", "stringcheese-core/std"]
# Enables heap-allocating utilities such as the `Vec`-returning helper on
# `FastCdc`. Kernels, iterators, and the `RollingHash` trait itself are
# available in a pure no-alloc build.
alloc = ["stringcheese-core/alloc"]
# Enables the SIMD backends for the rolling-hash fingerprints under
# `fingerprint::<hash>::simd`. Off by default because the arch-gated
# `#[target_feature]` scaffolding is only meaningful on `x86_64`,
# `aarch64`, and `wasm32+simd128`; every backend is byte-identical to
# the corresponding scalar `RollingHash::roll` sequence and is
# differentially tested against it. No external dependencies —
# intrinsics are consumed from `core::arch` only. Implies `std`
# because runtime CPU-feature detection on `x86_64` and `aarch64` goes
# through `std::arch::is_*_feature_detected!` (there is no
# `core::arch` equivalent stable today); the `wasm32+simd128` path
# gates on a compile-time `cfg` and does not need it, but the feature
# is unified for API-surface consistency. This matches the shape
# `stringcheese-compare`'s `simd` feature declares.
simd = ["std"]

[dependencies]
stringcheese-core = { workspace = true }

[dev-dependencies]
stringcheese-corpus = { workspace = true, features = ["alloc"] }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
