[package]
name = "stringcheese-fr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "French language pack for the StringCheese toolkit: ~200-word stopword list, Snowball French stemmer, elision-aware tokenizer, and PHONEX phonetic hookup. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["french", "stemmer", "snowball", "stopwords", "phonex"]
build = "build.rs"

# Ship the build.rs so downstream can regenerate SCUD packs.
include = [
    "build.rs",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The
# Snowball stemmer builds owned `String` output, `Language::tokenize`
# hands back a `Box<dyn Iterator>`, and the PHONEX adapter returns
# owned `String` keys — all `alloc`-only. Without this feature the
# crate compiles down to the stopword slice and the constants alone
# (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Ship the case-fr.scud pack (WIT-i18n Phase 1 case-mapping data for
# French). Adds a `case_data` module exposing `CASE_FR_SCUD:
# &'static [u8]` and a helper for constructing a
# `stringcheese_icu_case::CasePack`. French uses the default Unicode
# case-mapping behaviour (no locale tailoring like Turkish's dotted
# / dotless-I); the pack ships ASCII, Latin-1 supplement, Latin
# Extended-A, the Œ/Æ ligatures, and the German ß expansion so a
# composed engine behaves identically regardless of which pack the
# query resolves through first. Pack is well under 4 KiB. Enabled
# by default; opt out on ROM-constrained targets by turning off
# default features.
case-scud = ["dep:stringcheese-icu-case", "stringcheese-icu-case/alloc"]
# Ship the collation-fr.scud pack (WIT-i18n Phase 2 collation
# tailoring data for French). Adds a `collation_data` module
# exposing `COLLATION_FR_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_collation::CollationPack`.
# Ships DUCET-root ordering plus the ligature expansions
# (Æ/æ → AE/ae, Œ/œ → OE/oe). The French backwards-secondary
# accent rule (accents compared right-to-left within a word) is a
# documented Phase 2 CollationEngine deferral — the shipped
# tailoring matches en's DUCET behaviour with the ligature
# expansions the pack carries.
collation-scud = ["dep:stringcheese-icu-collation", "stringcheese-icu-collation/alloc"]
# Ship the plural-fr.scud pack (WIT-i18n Phase 3 plural-rule data
# for French). Adds a `plural_data` module exposing `PLURAL_FR_SCUD:
# &'static [u8]` and a helper for constructing a
# `stringcheese_icu_plural::PluralPack`. Requires the plural crate's
# `std` feature because plural classification uses `f64::trunc` /
# `f64::abs`.
plural-scud = ["dep:stringcheese-icu-plural", "stringcheese-icu-plural/std"]
# Ship the number-fr.scud pack (WIT-i18n Phase 3 number-formatting
# data for French). Adds a `number_data` module exposing
# `NUMBER_FR_SCUD: &'static [u8]` and a helper for constructing a
# `stringcheese_icu_number::NumberPack`.
number-scud = ["dep:stringcheese-icu-number", "stringcheese-icu-number/std"]
# Ship the datetime-fr.scud pack (WIT-i18n Phase 4 date/time-
# formatting data for French). Adds a `datetime_data` module
# exposing `DATETIME_FR_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_datetime::DateTimePack`.
datetime-scud = ["dep:stringcheese-icu-datetime", "stringcheese-icu-datetime/std"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# WIT-i18n case / collation / plural / number capability crates.
# Optional; pulled in under the corresponding `-scud` features.
stringcheese-icu-case = { workspace = true, optional = true }
stringcheese-icu-collation = { workspace = true, optional = true }
stringcheese-icu-plural = { workspace = true, optional = true }
stringcheese-icu-number = { workspace = true, optional = true }
# WIT-i18n date/time-formatting capability crate. Optional; only
# pulled in when the `datetime-scud` feature is enabled.
stringcheese-icu-datetime = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the plural-fr / number-fr SCUD packs.
stringcheese-scud = { workspace = true, features = ["alloc"] }
# Build-time re-use of plural predicate opcodes and helpers.
stringcheese-icu-plural = { workspace = true, features = ["std"] }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
