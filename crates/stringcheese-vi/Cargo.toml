[package]
name = "stringcheese-vi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vietnamese language pack for the StringCheese toolkit: ~180-word Unicode stopword list carrying the full Vietnamese diacritic inventory (letter modifiers ă â đ ê ô ơ ư plus the five tone marks grave / acute / hook-above / tilde / dot-below), configurable Vietnamese normalizer (NFC canonicalization by default; opt-in tone-mark stripping keeps letter modifiers; opt-in full-diacritic stripping folds to plain ASCII), whitespace-and-punctuation tokenizer (Vietnamese words are space-delimited so the SimpleTokenizer wrapper suffices), identity-style stemmer (Vietnamese is analytic — no inflection to strip; the module documents this and returns the NFC form as a canonical key), and a PHONEX-Vietnamese Soundex-shape 4-char phonetic hookup with Vietnamese-tuned preprocessing (`ng → N`, `nh → N`, `ph → F`, `kh → K`, `tr → T`, `ch → X`; all diacritics stripped to plain ASCII first; adapter name `\"phonex-vi\"`). Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["vietnamese", "normalization", "stopwords", "phonex", "phonetic"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std", "unicode-normalization/std"]
# When enabled, the crate exposes its full public surface. The
# normalizer builds owned `String` output, `Language::tokenize` hands
# back a `Box<dyn Iterator>`, the identity stemmer returns a
# canonicalized `Cow<str>`, and the PHONEX-Vietnamese phonetic encoder
# returns an owned `String` key — all `alloc`-only. Without this
# feature the crate compiles down to the stopword slice and the module
# constants alone (enough to link against on embedded targets that
# only want the stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# Vietnamese normalization defaults to NFC — precomposed vowels with
# their diacritics. The `unicode-normalization` crate is the workspace
# standard for NFC / NFD / NFKC / NFKD (the same crate
# `stringcheese-unicode` builds on); we depend on it directly rather
# than pulling `stringcheese-unicode` in for its full ICU-backed
# surface. `default-features = false` keeps it usable on `no_std +
# alloc` targets; the `std` feature is pulled in via this crate's
# `std` feature above.
unicode-normalization = { version = "0.1", default-features = false }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
