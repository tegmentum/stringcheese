[package]
name = "stringcheese-zh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Chinese (Simplified) language pack for the StringCheese toolkit: ~80-entry stopword list, character-level tokenizer (dictionary-free — every CJK Han scalar becomes its own token; Latin/digit runs stay together), identity stemmer (Chinese has no inflection), and a Hanyu Pinyin (tone-mark-stripped) phonetic encoder over a curated ~350-entry high-frequency Han character table. Implements stringcheese-lang::Language. Full word-segmentation via jieba / thulac / pkuseg-scale dictionaries is deferred; the base pack stays wasm-friendly and offline-first."
categories = ["text-processing", "internationalization"]
keywords = ["chinese", "mandarin", "pinyin", "tokenizer", "stopwords"]
build = "build.rs"

# Ship the build.rs so downstream can regenerate SCUD packs against
# the shipped rules.
include = [
    "build.rs",
    "build_dict.rs",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The
# tokenizer builds a `Box<dyn Iterator>`, the pinyin encoder returns
# owned `String` output, and the stemmer returns a `Cow<'_, str>` —
# all `alloc`-only. Without this feature the crate compiles down to
# the stopword slice, the character-classification enum, and the
# constants alone (enough to link against on embedded targets that
# only want the stopword table or the character classifier).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Ship the case-zh.scud pack (WIT-i18n Phase 1 case-mapping data
# for Chinese). Adds a `case_data` module exposing `CASE_ZH_SCUD:
# &'static [u8]` and a helper for constructing a
# `stringcheese_icu_case::CasePack`. Chinese Han characters have
# no case (upper/lower/title are all identity on Han); the pack
# ships ASCII a-z ↔ A-Z for uniform pack-hit behaviour when Latin
# characters appear in mixed CJK/Latin text, plus the German ß
# expansion for uniform composed-engine behaviour.
case-scud = ["dep:stringcheese-icu-case", "stringcheese-icu-case/alloc"]
# Ship the collation-zh.scud pack (WIT-i18n Phase 2 collation
# tailoring data for Chinese). Adds a `collation_data` module
# exposing `COLLATION_ZH_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_collation::CollationPack`.
#
# CLDR ships multiple `zh` collations: `standard` (stroke-based,
# numeric stroke order), `pinyin` (Latin pinyin transliteration),
# `stroke`, and `zhuyin`. **Both stroke-based and pinyin
# collations are Phase 2 CollationEngine deferrals** — each
# needs a large Han-to-order or Han-to-pinyin mapping table plus
# the algorithm changes to consume it. The shipped pack uses
# feruca's DUCET-root ordering (which sorts CJK Han by codepoint
# order — enough for deterministic sort but not linguistically
# meaningful). See `docs/design/wit-i18n.md` § 8.2.
collation-scud = ["dep:stringcheese-icu-collation", "stringcheese-icu-collation/alloc"]
# Ship the plural-zh.scud pack (WIT-i18n Phase 3 plural-rule data
# for Chinese cardinals). Chinese has no grammatical number so every
# input classifies as `other`; the pack still ships to make
# `PluralEngine::supports("zh")` return true and to advertise CLDR
# version provenance. Requires the plural crate's `std` feature.
plural-scud = ["dep:stringcheese-icu-plural", "stringcheese-icu-plural/std"]
# Ship the number-zh.scud pack (WIT-i18n Phase 3 number-formatting
# data for Chinese — Simplified conventions).
number-scud = ["dep:stringcheese-icu-number", "stringcheese-icu-number/std"]
# Ship the datetime-zh.scud pack (WIT-i18n Phase 4 date/time-
# formatting data for Chinese — Simplified conventions). Adds a
# `datetime_data` module exposing `DATETIME_ZH_SCUD: &'static [u8]`
# and a helper for constructing a `stringcheese_icu_datetime::DateTimePack`.
datetime-scud = ["dep:stringcheese-icu-datetime", "stringcheese-icu-datetime/std"]
# Ship the break-zh.scud pack (WIT-i18n Phase 5 CJK word-break
# dictionary for Chinese). Adds a `word_dict_data` module exposing
# `WORD_DICT_ZH_SCUD: &'static [u8]` and a helper for constructing
# a `stringcheese_icu_segment::BreakPack`. The starter dictionary
# is a ~500-entry hand-curated HSK-level list; full CC-CEDICT
# integration is a documented data-only follow-up.
break-scud = ["dep:stringcheese-icu-segment", "stringcheese-icu-segment/std"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# WIT-i18n case / collation / plural / number / datetime capability
# crates. Optional; pulled in under the corresponding `-scud` features.
stringcheese-icu-case = { workspace = true, optional = true }
stringcheese-icu-collation = { workspace = true, optional = true }
stringcheese-icu-plural = { workspace = true, optional = true }
stringcheese-icu-number = { workspace = true, optional = true }
stringcheese-icu-datetime = { workspace = true, optional = true }
stringcheese-icu-segment = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the plural-zh / number-zh SCUD packs.
stringcheese-scud = { workspace = true, features = ["alloc"] }
# Build-time re-use of the plural crate's `PluralRuleId` opcodes and
# per-locale helper functions.
stringcheese-icu-plural = { workspace = true, features = ["std"] }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
