[package]
name = "stringcheese-translit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Script-to-script transliteration for the StringCheese toolkit. A `Transliterator` trait; a `DeunicodeTransliterator` for the general 'any-script → ASCII approximation' path (wraps deunicode); a `TableTransliterator` for the classic char-to-string lookup pattern; and one built-in ISO 9 Cyrillic → Latin table as a template. Language-pack romanizers plug into the same trait in follow-ups."
categories = ["text-processing", "internationalization"]
keywords = ["transliteration", "romanization", "cyrillic", "unicode", "deunicode"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
# Unicode-to-ASCII approximation table (~200 KB static data).
# Same choice as `stringcheese-ident`'s slug module; a general-
# purpose transliterator we'd otherwise re-derive from per-script
# tables one at a time.
deunicode = "1"

[dev-dependencies]
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version. See `benches/translit.rs` for the
# groups it drives and the baseline table under the crate-level `//!`
# docs for last-measured numbers.
criterion = { workspace = true }

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-translit`. Baseline numbers live in the crate-level
# `//!` docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "translit"
harness = false

[lints]
workspace = true
