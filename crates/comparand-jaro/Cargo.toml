[package]
name = "comparand-jaro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Jaro and Jaro-Winkler similarity for the Comparand sequence-comparison toolkit."
categories = ["algorithms", "text-processing"]
keywords = ["jaro", "jaro-winkler", "similarity", "comparison"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "comparand-core/std"]
# When enabled, the crate may use heap-allocating types from `alloc`. The
# Jaro matching kernel requires scratch `Vec<bool>` buffers, so the
# implementation modules are gated on this feature; without it the crate
# compiles as an empty no-alloc surface for embedded builds that only need
# to link against the substrate crates.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
# Golden-case schema; test-only. `alloc` is enabled so property tests can
# use the exhaustive generators.
comparand-corpus = { workspace = true, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
