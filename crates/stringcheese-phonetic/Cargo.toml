[package]
name = "stringcheese-phonetic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Phonetic encoding and matching algorithms (Soundex, Metaphone, NYSIIS, and multilingual packs) for StringCheese."
categories = ["algorithms", "text-processing", "internationalization"]
keywords = ["comparison", "phonetic", "soundex", "metaphone", "nysiis"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-core/std"]
# When enabled, the crate exposes its full public surface. Every phonetic
# encoder returns owned `String`s (or a small struct containing them), so
# the entire public surface is behind the `alloc` feature; without it the
# crate compiles as an empty no-alloc surface for embedded builds that
# only need to link against the substrate crates.
alloc = ["stringcheese-core/alloc"]
# When enabled, the criterion bench harness pulls in a best-in-class
# Rust phonetic-encoder oracle crate (`rphonetic`, the Rust port of the
# Apache commons-codec phonetic algorithms — Soundex, Metaphone, Double
# Metaphone, NYSIIS, Match-Rating, and more) and adds side-by-side
# oracle-comparison bench groups. The feature is off by default because
# it is bench-only: no library code looks at the oracle crate, and the
# ordinary `cargo bench -p stringcheese-phonetic` invocation must keep
# working without pulling the extra crate. See `benches/phonetic.rs`
# for the gated groups and `docs/perf/phonetic-oracle-gaps.md` for the
# last-measured gap table.
oracle-benches = ["dep:rphonetic"]

[dependencies]
stringcheese-core = { workspace = true }
# --- optional oracle-comparison bench dep --------------------------------
#
# `rphonetic` (3.0) — Rust port of the Apache commons-codec phonetic
# encoder family (Soundex, Metaphone, Double Metaphone, NYSIIS,
# Refined Soundex, Match-Rating, Beider-Morse, Caverphone, Cologne,
# Daitch-Mokotoff). Best breadth in the Rust ecosystem, and the only
# crate that covers all four English-language stringcheese encoders
# (Soundex, primary Double Metaphone, full Double Metaphone, NYSIIS)
# in one place.
#
# Marked `optional = true` and gated by the `oracle-benches` feature;
# a plain `cargo build` / `cargo test` / `cargo bench` never pulls it
# in. Lives in `[dependencies]` (not `[dev-dependencies]`) because
# Cargo does not allow optional dev-deps. Locks ~21 additional
# packages into `Cargo.lock` (regex, nom, serde-derive, and their
# transitives) — one over the 20-entry budget documented in
# `docs/perf/oracle-gap-summary.md`, flagged there and justified by
# the four-encoder oracle coverage this single crate provides.
#
# Alternatives considered and rejected:
#
# * `metaphone` (0.1, max-frai/metaphone-rs) — Metaphone-only. Would
#   add ~2 additional packages (aho-corasick, itertools) on top of
#   rphonetic for zero incremental coverage; rphonetic already ships
#   Metaphone. Rejected as duplicate.
# * `soundex` / `soundex-rs` — Soundex-only. Same rejection reason;
#   rphonetic already ships Soundex, and neither standalone crate is
#   more mature than the rphonetic port of the Apache commons-codec
#   reference. Rejected as duplicate.
rphonetic = { version = "3", optional = true }

[dev-dependencies]
# Golden-case schema; test-only. `alloc` is enabled so the golden case
# fixtures and property tests can share ownership machinery.
stringcheese-corpus = { workspace = true, features = ["alloc"] }
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version as the reference bench crate
# `stringcheese-tokenizer-hf-bench`. See `benches/phonetic.rs` for the
# groups it drives and the baseline table under the crate-level
# `//!` docs for last-measured numbers.
criterion = { workspace = true }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-phonetic`. Baseline numbers live in the crate-level `//!`
# docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "phonetic"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
