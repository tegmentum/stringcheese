[package]
name = "stringcheese-ru"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Russian language pack for the StringCheese toolkit: ~180-word Cyrillic stopword list, Snowball Russian stemmer with ё→е precomputation, whitespace-and-punctuation tokenizer, and a GOST 7.79 System B Cyrillic→ASCII transliteration adapter. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["russian", "stemmer", "snowball", "stopwords", "cyrillic"]
build = "build.rs"

# Ship the build.rs so downstream can regenerate SCUD packs against
# the shipped rules.
include = [
    "build.rs",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The Snowball
# stemmer builds owned `String` output, `Language::tokenize` hands back
# a `Box<dyn Iterator>`, and the transliteration encoder returns an
# owned `String` key — all `alloc`-only. Without this feature the
# crate compiles down to the stopword slice and the module constants
# alone (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Opt in to the cross-Slavic `SlavicMetaphone` sound-alike encoder from
# `stringcheese-phonetic` as an alternate phonetic encoder alongside the
# default GOST 7.79-B transliteration. Off by default so callers who
# only want the transliteration pay no cost for the shared Slavic
# family encoder's tables; on by opt-in via
# `RUSSIAN_WITH_SLAVIC_METAPHONE` (or `Russian::with_slavic_metaphone_encoder`).
# Requires `alloc` because the encoder returns owned `String` keys.
slavic-metaphone = ["alloc"]
# Ship the case-ru.scud pack (WIT-i18n Phase 1 case-mapping data for
# Russian). Adds a `case_data` module exposing `CASE_RU_SCUD:
# &'static [u8]` and a helper for constructing a
# `stringcheese_icu_case::CasePack`. Russian uses the default
# Unicode case-mapping rules for Cyrillic (no Turkish-style locale
# tailoring); the pack ships the modern Russian Cyrillic alphabet
# (A-Я / а-я plus Ё/ё) as simple upper/lower pairs, ASCII a-z ↔
# A-Z for uniform pack-hit behaviour, and the German ß expansion.
case-scud = ["dep:stringcheese-icu-case", "stringcheese-icu-case/alloc"]
# Ship the collation-ru.scud pack (WIT-i18n Phase 2 collation
# tailoring data for Russian). Adds a `collation_data` module
# exposing `COLLATION_RU_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_collation::CollationPack`.
#
# CLDR's Russian collation is close to default UCA for Cyrillic
# (feruca's DUCET-root already produces the right ordering); the
# shipped pack carries options + a small expansion table. The
# Russian **case-second variant** (uppercase-first vs lowercase-
# first ordering) is a documented Phase 2 CollationEngine
# deferral — see `docs/design/wit-i18n.md` § 8.2.
collation-scud = ["dep:stringcheese-icu-collation", "stringcheese-icu-collation/alloc"]
# Ship the plural-ru.scud pack (WIT-i18n Phase 3 plural-rule data for
# Russian cardinals). Adds a `plural_data` module exposing
# `PLURAL_RU_SCUD: &'static [u8]` and a helper for constructing a
# `stringcheese_icu_plural::PluralPack`. Enabled through `--features
# plural-scud`; the pack is under 60 bytes. Requires the plural
# crate's `std` feature because plural classification uses `f64::trunc`
# / `f64::abs`.
plural-scud = ["dep:stringcheese-icu-plural", "stringcheese-icu-plural/std"]
# Ship the number-ru.scud pack (WIT-i18n Phase 3 number-formatting
# data for Russian). Adds a `number_data` module exposing
# `NUMBER_RU_SCUD: &'static [u8]` and a helper for constructing a
# `stringcheese_icu_number::NumberPack`.
number-scud = ["dep:stringcheese-icu-number", "stringcheese-icu-number/std"]
# Ship the datetime-ru.scud pack (WIT-i18n Phase 4 date/time-
# formatting data for Russian). Adds a `datetime_data` module
# exposing `DATETIME_RU_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_datetime::DateTimePack`.
datetime-scud = ["dep:stringcheese-icu-datetime", "stringcheese-icu-datetime/std"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# WIT-i18n case / collation / plural / number / datetime capability
# crates. Optional; pulled in under the corresponding `-scud` features.
stringcheese-icu-case = { workspace = true, optional = true }
stringcheese-icu-collation = { workspace = true, optional = true }
stringcheese-icu-plural = { workspace = true, optional = true }
stringcheese-icu-number = { workspace = true, optional = true }
stringcheese-icu-datetime = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the plural-ru / number-ru SCUD packs. Emits
# blobs into `$OUT_DIR/{plural,number}-ru.scud`; the crate's
# `plural_data` / `number_data` modules `include_bytes!`-es them
# back at compile time. `stringcheese-scud` is a build-dep (not a
# runtime dep) because the writer is only used during codegen —
# the shipped binary contains only the encoded blob, not the writer
# machinery.
stringcheese-scud = { workspace = true, features = ["alloc"] }
# Build-time re-use of the plural crate's `PluralRuleId` opcodes and
# per-locale helper functions (avoids re-encoding rule ids by their
# raw u8 in every language pack). Runtime dep is separately gated
# behind the `plural-scud` feature.
stringcheese-icu-plural = { workspace = true, features = ["std"] }

[dev-dependencies]
# Cross-pack Slavic-Metaphone equivalence tests: the Ukrainian and
# Serbian packs are dev-deps of the Russian pack so
# `tests/slavic_metaphone_cross_pack.rs` can prove that the shared
# cross-Slavic encoder (accessed via each pack's
# `..._WITH_SLAVIC_METAPHONE` constant) produces the same key for
# equivalent inputs — the whole point of the encoder living in
# `stringcheese-phonetic` and being wired identically into every
# Slavic pack. Only the slavic-metaphone feature needs to be on;
# every other pack feature is default-enabled through
# `default-features = true`.
stringcheese-uk = { workspace = true, default-features = true, features = ["slavic-metaphone"] }
stringcheese-sr = { workspace = true, default-features = true, features = ["slavic-metaphone"] }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
