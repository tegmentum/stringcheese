[package]
name = "stringcheese-lang-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Build-time generator for StringCheese per-language crates. Reads a `rules/<bcp47>.toml` and emits a static `LanguageCapabilities` value the per-language crate `include!`s at build time. NEVER pulled in at runtime — this crate belongs in every per-language crate's `[build-dependencies]` and drops out of the compiled binary. See `docs/design/language-architecture.md` § 1 for the design."
categories = ["development-tools", "text-processing", "internationalization"]
keywords = ["build-script", "codegen", "language", "stopwords", "wit"]

# NOTE: no `[lib] crate-type = ["cdylib", ...]`. This crate is a
# build-time helper — consumers add it as a `[build-dependencies]`
# entry and call `generate()` from their own `build.rs`. Nothing
# emitted here reaches the consumer's runtime binary.

[dependencies]
serde = { version = "1", features = ["derive"] }
toml  = "0.8"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
