[package]
name = "stringcheese-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "String statistics and characterization for the StringCheese toolkit: Shannon entropy over code points, Unicode general-category histograms, byte/code-point/grapheme length triples, and printable/control/whitespace/digit/alpha ratios. Explicit Unicode semantic units at every boundary — no silent choice between bytes and code points. Useful for deciding which subsequent operation to apply (which tokenizer, which normaliser, which fallback)."
categories = ["text-processing", "internationalization"]
keywords = ["statistics", "entropy", "histogram", "unicode", "characterization"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

# Grapheme-cluster counting for `Lengths::graphemes`. Passes through
# to `stringcheese-segment/icu`. Without this feature `Lengths` still
# reports bytes + code points; `graphemes` is `None`.
graphemes = ["stringcheese-segment/icu", "std"]

[dependencies]
# Compact table lookup for `char → GeneralCategory` (Lu, Ll, Nd, Po, …).
# ~30 KB of static data in exchange for the full Unicode 15 property
# table — reimplementing this would be its own arc.
unicode-general-category = "1"

# `GeneralCategory` doesn't implement `Ord`, so BTreeMap is out;
# hashbrown gives us an alloc-friendly HashMap that works without
# `std` — matches this crate's `alloc` feature baseline.
hashbrown = { version = "0.14", default-features = false, features = ["ahash"] }

# Only used when `graphemes` is on. Kept optional so the default
# build stays ICU-free.
stringcheese-segment = { workspace = true, optional = true }

[dev-dependencies]
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version. See `benches/stats.rs` for the
# groups it drives and the baseline table under the crate-level
# `//!` docs for last-measured numbers.
criterion = { workspace = true }

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-stats`. Baseline numbers live in the crate-level `//!`
# docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "stats"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
