[package]
name = "stringcheese-tokenizer-hf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "HuggingFace-shape tokenizer loader (BPE + WordPiece + Unigram + normalizer + post-processor) for the StringCheese toolkit."
categories = ["algorithms", "text-processing", "no-std"]
keywords = ["tokenizer", "bpe", "nlp", "tiktoken", "wasm"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
# Also enables the regex-based pre-tokenizer (see
# `src/pre_tokenizer.rs`), which requires the `fancy-regex` backend
# and hence a full `std` environment.
std = ["alloc", "stringcheese-core/std", "stringcheese-tokenizer/std", "dep:fancy-regex"]
# When enabled, the crate exposes its heap-allocating public surface.
# The BPE algorithm inherently allocates (per-word piece sequences,
# vocabulary tables, merge maps); the crate compiles to an empty
# surface without this feature.
alloc = ["stringcheese-core/alloc", "stringcheese-tokenizer/alloc"]
# Hugging Face `tokenizer.json` parser (see `src/hf.rs`). Implies
# `std` because the JSON parser (`serde_json`) and the regex-based
# pre-tokenizer both require the standard library. Callers on
# `no_std` targets need only omit the feature; the rest of the crate
# is unaffected. Enabling this feature also pulls in the
# `hf-normalizer` sub-feature so `tokenizer.json` blobs with an
# NFC/NFD/NFKC/NFKD normalizer round-trip end-to-end (the extra
# dependency is `unicode-normalization`, a couple of hundred KB of
# static tables).
hf-tokenizer = ["std", "dep:serde", "dep:serde_json", "hf-normalizer"]
# Standalone knob for the Unicode-normalization layer used by both
# the HF `tokenizer.json` `normalizer` block and any caller that
# wants to hand the produced `BpeTokenizer` an NFC / NFD / NFKC /
# NFKD normalizer directly. Split out so a caller can build only the
# HF JSON parser without also compiling in `unicode-normalization` —
# `hf-tokenizer` still implies this on by default, matching the
# expected "I want a full tokenizer.json loader" story.
hf-normalizer = ["std", "dep:unicode-normalization"]
# Opt into the conformance suite that exercises the crate against the
# *real* upstream vocabulary of each fixture checkpoint (`gpt2`,
# `cl100k_base`, `bert-base-uncased`, `xlm-roberta-base`; see
# `tests/conformance/` for the JSON fixtures with reference-computed
# ids). Enabling the feature turns off the per-test `#[ignore]` gate;
# the runner then requires a real `tokenizer.json` (HF-shape) for each
# checkpoint to be materialised on disk under one of the two lookup
# roots documented in `tests/conformance.rs`. Implies `hf-tokenizer`
# because loading and dispatching those vocabs goes through
# [`crate::hf`]. The feature name is deliberately shared with the
# parallel tiktoken parity work so a single flag activates both
# families of vocab-backed tests.
parity-real-vocab = ["hf-tokenizer"]

[dependencies]
stringcheese-core = { workspace = true }
stringcheese-tokenizer = { workspace = true }

# `hashbrown` gives us an `alloc`-friendly, `no_std`-compatible
# `HashMap` for `BpeMergeTable::rank`. The prior storage —
# `BTreeMap<(Vec<u8>, Vec<u8>), u32>` — was O(log n) with per-lookup
# allocations for the tuple key; the audit called it out as the
# dominant encode-time cost. The concat-key HashMap shape mirrors
# tiktoken's `HashMap<Vec<u8>, Rank>` layout. `ahash` picks the
# aarch64 NEON-accelerated variant automatically on the host and
# stays portable elsewhere; both fall back cleanly on wasm.
hashbrown = { version = "0.14", default-features = false, features = ["ahash"] }

# Regex backend for the Phase 2b pre-tokenizer. `fancy-regex` is the
# only mainstream Rust regex crate that supports both Unicode general
# categories (`\p{L}`, `\p{N}`) *and* look-around (`(?!\S)`) — both
# required to compile tiktoken's canonical `cl100k_base` /
# `o200k_base` pre-tokenizer pattern verbatim. See
# `src/pre_tokenizer.rs` for the full rationale. Only compiled when
# `std` is enabled (fancy-regex itself requires the standard library).
fancy-regex = { version = "0.14", default-features = false, features = ["std", "unicode"], optional = true }

# JSON parser for the Hugging Face `tokenizer.json` loader (see
# `src/hf.rs`). Only compiled when the `hf-tokenizer` feature is on.
# Both crates use their default (std) feature set — the loader itself
# requires `std` for `fancy-regex` and for `std::error::Error` impls
# on the returned errors, so pulling in `serde`/`serde_json` with
# their standard features is not a footprint regression relative to
# the surrounding module.
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }

# Unicode normalisation forms (NFC / NFD / NFKC / NFKD) for the
# `normalizer` slot in Hugging Face `tokenizer.json` blobs — see
# `src/normalizer.rs`. Gated behind the `hf-normalizer` feature (which
# `hf-tokenizer` enables by default) so callers on `no_std` targets or
# who only want the raw BPE algorithm do not pay for the crate's
# static tables.
unicode-normalization = { version = "0.1", default-features = false, features = ["std"], optional = true }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"
# `serde_json` for the conformance fixture loader in
# `tests/conformance.rs`. Only used when the `hf-tokenizer` /
# `parity-real-vocab` features are on (the runner is `#[cfg]`-gated on
# them), but declaring it here rather than under a target-features
# section keeps `cargo test --all-features` unambiguous. Matches the
# same target-gate as `proptest` — the conformance runner is host-only.
serde_json = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
