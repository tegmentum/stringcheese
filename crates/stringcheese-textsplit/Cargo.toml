[package]
name = "stringcheese-textsplit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Text splitters and semantic chunkers for the StringCheese toolkit. Complements the byte-oriented content-defined chunking in `stringcheese-cdc` with the text-oriented splitters LLM pipelines actually reach for: a LangChain-style RecursiveSplitter (separator list + target size + overlap), a SentenceSplitter (group sentences until size threshold), a ParagraphSplitter (split on double-newline). Every chunk carries its byte range in the original input so downstream can point back."
categories = ["text-processing"]
keywords = ["chunker", "text-splitter", "llm", "rag", "recursive-splitter"]

[features]
default = ["std"]
std = ["alloc", "stringcheese-segment/std"]
alloc = ["stringcheese-segment/alloc"]

# Enables sentence-boundary detection via ICU4X. Without it,
# `SentenceSplitter` uses the naive `. ` / `? ` / `! ` fallback
# already in stringcheese-segment.
sentences-icu = ["stringcheese-segment/icu"]

[dependencies]
# Sentence and line boundaries delegate to stringcheese-segment;
# this crate never re-implements segmentation.
stringcheese-segment = { workspace = true }

[dev-dependencies]
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version. See `benches/textsplit.rs` for the
# groups it drives and the baseline table under the crate-level
# `//!` docs for last-measured numbers.
criterion = { workspace = true }

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-textsplit`. Baseline numbers live in the crate-level
# `//!` docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "textsplit"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
