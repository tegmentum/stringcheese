[package]
name = "stringcheese-ident"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Identifier and slug utilities for the StringCheese toolkit: case conversion (camelCase / snake_case / kebab-case / PascalCase / SCREAMING_SNAKE), case detection for round-trip normalization, Unicode-to-ASCII slug generation, and identifier sanitization with a configurable character policy. Wraps mature ecosystem crates (`heck` for case, `deunicode` for transliteration) behind a StringCheese-native API — one `Case` enum, one `Slugger` builder, one `Sanitizer` builder."
categories = ["text-processing", "internationalization"]
keywords = ["identifier", "slug", "case-conversion", "camel-case", "unicode"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
# Mature, small, well-audited case-conversion library — the case
# conversions are what its whole surface is. Our value is the
# `Case` enum + `to_case()` dispatch that fits the rest of the
# StringCheese type discipline (explicit target unit at every
# call site).
heck = "0.5"

# Unicode → ASCII transliteration table. Ships ~200 KB of static
# lookup data; the alternative is a per-script romanization suite
# we don't want to own. Used inside `slugify`.
deunicode = "1"

[dev-dependencies]
# Criterion bench harness — workspace-inherited so every bench-adopting
# crate tracks the same version. See `benches/ident.rs` for the groups
# it drives and the baseline table under the crate-level `//!` docs
# for last-measured numbers.
criterion = { workspace = true }

# ---------------------------------------------------------------------------
# Bench harness — mirrors the shape used by the sibling compute-heavy
# crates (`stringcheese-compare`, `stringcheese-manip`, ...). `harness =
# false` so criterion owns `main`. Run with `cargo bench -p
# stringcheese-ident`. Baseline numbers live in the crate-level `//!`
# docs of `src/lib.rs`.
# ---------------------------------------------------------------------------
[[bench]]
name = "ident"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
