[package]
name = "stringcheese-icu-collation-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reference WebAssembly component packaging for the StringCheese ICU-alternative collation capability. Wraps `stringcheese-icu-collation`'s `CollationEngine` behind the shared `stringcheese:icu-collation@0.1.0` WIT contract, feature-gated so a component-model host can load the collator through the standard `collation-world` exports while callers of the plain `rlib` avoid any wit-bindgen-rt symbol collisions. The reference build embeds the `stringcheese-en` and `stringcheese-de` SCUD packs so the shipped .wasm is drivable end-to-end without a separate pack component."
categories = ["text-processing", "internationalization", "wasm"]
keywords = ["collation", "icu", "unicode", "wasm", "component-model"]

[lib]
# Dual-target: `rlib` for Rust callers (unit tests, host-side
# embedding), `cdylib` for the WIT component build produced by
# `cargo build --target wasm32-wasip1 --features wit-component`.
crate-type = ["cdylib", "rlib"]

[features]
# `alloc` is required unconditionally — the WIT `collation-world`
# exports functions that return owned `String`s and `Vec<u8>`s, and
# the `CollationEngine` the guest wraps is `alloc`-only. `std` is
# enabled by default for parity with the rest of the WIT-i18n
# subsystem.
default = ["std"]
std = [
    "stringcheese-icu-collation/std",
    "stringcheese-en/std",
    "stringcheese-de/std",
    "stringcheese-fr/std",
    "stringcheese-tr/std",
    "stringcheese-ru/std",
    "stringcheese-zh/std",
]

# `wit-component` opts into the WIT `Guest` implementations and the
# `export!` invocation that turns this crate into a standalone
# `stringcheese:icu-collation@0.1.0` WASM component. Off by default
# so the crate can be linked as a plain `rlib` sibling of other WIT
# components without every backend emitting the same exported
# symbols and tripping the linker with duplicate-export errors —
# matches the pattern established by
# `stringcheese-tokenizer-component`,
# `stringcheese-icu-case-component`, and the
# `stringcheese-detect-{script,whatlang,lingua}` crates. Enable this
# only for the standalone-component build produced by
# `cargo build --target wasm32-wasip1 --features wit-component`.
wit-component = ["std", "dep:wit-bindgen-rt"]

[dependencies]
# The collation algorithm crate. Provides `CollationEngine`,
# `CollationPack`, `CollationStrength`, and the `CollationError`
# variants the WIT `collation-error` mirrors.
stringcheese-icu-collation = { workspace = true, features = ["alloc"] }
# English, German, French, Turkish, Russian, and Chinese SCUD packs
# — the WIT-i18n Phase 6 six-locale roster. Embedded so the shipped
# .wasm is drivable end-to-end for the smoke test: the German
# phonebook tailoring (`ä → ae`, `ß → ss`, ...) ships inside the
# same component, and the fr / tr / ru / zh packs contribute their
# own expansions plus the shared ß → ss row for uniform
# cross-locale behaviour. The `collation-scud` feature exposes
# each pack's `collation_data::collation_pack()` helper.
stringcheese-en = { workspace = true, features = ["collation-scud"] }
stringcheese-de = { workspace = true, features = ["collation-scud"] }
stringcheese-fr = { workspace = true, features = ["collation-scud"] }
stringcheese-tr = { workspace = true, features = ["collation-scud"] }
stringcheese-ru = { workspace = true, features = ["collation-scud"] }
stringcheese-zh = { workspace = true, features = ["collation-scud"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# Pulled in only when the `wit-component` feature is enabled — see
# the feature docs above. `optional = true` keeps it off the
# dependency tree for non-component wasm consumers (e.g. any
# downstream that links this crate as a plain `rlib` alongside other
# capability backends). Version + feature set pinned in lockstep
# with `stringcheese-icu-case-component` and
# `stringcheese-tokenizer-component` so a workspace-wide
# wit-bindgen bump lands in one place.
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"], optional = true }

[dev-dependencies]
# `wit-parser` gives a strong "the WIT file parses cleanly" gate
# that does not require the wasm toolchain to be present. The unit
# test in `src/lib.rs` reads the shipped WIT source and asserts the
# parser accepts it, mirroring the smoke already living in
# `stringcheese-icu-collation/tests/wit_parse.rs` so a regression
# that breaks the component wrapper's view of the WIT surfaces
# here too.
wit-parser = "0.230"

# `wasmtime` drives the in-process component runtime the smoke tests
# in `tests/component_smoke.rs` invoke each of the WIT exports
# through. Feature-pinned to the minimal set the tests need
# (`runtime` + `cranelift` + `component-model` + `std`) — same
# trimmed shape as `stringcheese-icu-case-component`.
wasmtime = { version = "26", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

# Companion crate that ships the WASI preview2 host implementations
# behind `add_to_linker_sync`. The collation component does no I/O
# of its own, but the wasip1 -> wasip2 adapter applied at
# componentize time introduces a `wasi:*@0.2.x` import surface
# that the linker must satisfy before `instantiate` will succeed.
wasmtime-wasi = { version = "26", default-features = false }

[lints]
workspace = true
