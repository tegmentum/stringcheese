[package]
name = "comparand-cdc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Content-defined chunking (FastCDC) and rolling-hash fingerprints (Rabin, polynomial, Gear) for the Comparand toolkit."
categories = ["algorithms", "compression"]
keywords = ["cdc", "fastcdc", "chunking", "rabin", "rolling-hash"]

[features]
default = ["std"]
# Enables the standard library. Implies `alloc`. Without this feature the
# crate compiles as `#![no_std]`.
std = ["alloc", "comparand-core/std"]
# Enables heap-allocating utilities such as the `Vec`-returning helper on
# `FastCdc`. Kernels, iterators, and the `RollingHash` trait itself are
# available in a pure no-alloc build.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
comparand-corpus = { workspace = true, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
