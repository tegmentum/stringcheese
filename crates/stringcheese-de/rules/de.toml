# German language pack — data-driven rules.
#
# Ported from the historical src/stopwords.rs when the German pack
# migrated to the stringcheese-lang-gen build-time generator. The
# TOML is the single source of truth; touching src/stopwords.rs has
# no effect (it just re-exports CAPABILITIES.stopwords).

[locale]
bcp47 = "de"
icu = "de"
name = "German"
script = "Latn"

[stopwords]
# ~253-entry list — the union of NLTK's `german` list (which
# descends from the widely-cited Snowball / Porter German stopword
# list) and the Snowball reference file itself. Carries articles,
# personal pronouns, auxiliaries, modals, prepositions,
# conjunctions, and inflected forms of all of the above. Umlaut
# vowels round-trip verbatim through the generator.
list = [
    "der", "die", "das", "des", "dem", "den", "ein", "eine",
    "einer", "eines", "einem", "einen", "kein", "keine", "keiner", "keines",
