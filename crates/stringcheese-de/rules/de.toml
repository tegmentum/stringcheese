    "deiner", "deines", "deinem", "deinen", "er", "ihn", "ihm", "sein",
    "seine", "seiner", "seines", "seinem", "seinen", "sie", "ihr", "ihre",
    "ihrer", "ihres", "ihrem", "ihren", "es", "wir", "uns", "unser",
