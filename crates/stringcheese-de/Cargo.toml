[package]
name = "stringcheese-de"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "German language pack for the StringCheese toolkit: ~250-word stopword list, Snowball German stemmer, Kölner Phonetik (Postel 1969) encoder, and simple word tokenizer. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["german", "stemmer", "snowball", "stopwords", "koelner-phonetik"]
build = "build.rs"

# Ship the rules TOML so downstream builds can regenerate against the shipped rules.
include = [
    "build.rs",
    "rules/**/*.toml",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The Snowball
# stemmer builds owned `String` output, `Language::tokenize` hands back a
# `Box<dyn Iterator>`, and the Kölner Phonetik encoder returns an owned
# `String` key — all `alloc`-only. Without this feature the crate
# compiles down to the stopword slice and the module constants alone
# (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Ship the collation-de.scud pack (the WIT-i18n Phase 2 collation
# tailoring data for German). Adds a `collation_data` module
# exposing `COLLATION_DE_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_collation::CollationPack`.
# Enabled by default — the pack is small (~200 B for the umlauts +
# ß expansion table). Opt out on ROM-constrained targets by
# turning off default features.
#
# The pack ships the DIN 5007-2 (phonebook) tailoring: `ß → ss`,
# `ä → ae`, `ö → oe`, `ü → ue`, and their uppercase counterparts.
# The design commits to the phonebook ordering as the shipped
# default; dictionary ordering (DIN 5007-1) is available via the
# native `GermanCollator::DIN_5007_DICTIONARY` preset.
collation-scud = ["dep:stringcheese-icu-collation", "stringcheese-icu-collation/alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# WIT-i18n collation capability crate. Optional; only pulled in
# when the `collation-scud` feature is enabled.
stringcheese-icu-collation = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the data-driven surface (stopwords,
# capability record). Runs in build.rs, emits into OUT_DIR, never
# reaches the shipped binary. See docs/design/language-architecture.md.
stringcheese-lang-gen = { workspace = true }
# Build-time codegen for the collation-de.scud pack. Emits the
# SCUD blob into `$OUT_DIR/collation-de.scud`; the crate's
# `collation_data` module `include_bytes!`-es it back at compile
# time.
stringcheese-scud = { workspace = true, features = ["alloc"] }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
