[package]
name = "stringcheese-winnowing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Document fingerprinting via winnowing (Schleimer, Wilkerson & Aiken, 2003) for the StringCheese toolkit. Given a stream of hashed n-grams, select the minimum hash in each sliding window of size w — the classical 'local' fingerprint scheme used by Moss and every similar plagiarism-detection stack. O(w) memory via a monotonic deque; deterministic leftmost-min tie-breaking matches the reference paper."
categories = ["algorithms", "text-processing"]
keywords = ["winnowing", "fingerprint", "moss", "plagiarism-detection", "sketch"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
