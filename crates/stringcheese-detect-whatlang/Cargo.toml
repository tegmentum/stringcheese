[package]
name = "stringcheese-detect-whatlang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tier-1 language detection for the StringCheese detection stack. Wraps `whatlang` behind the shared tegmentum:lang-detect@0.2.0 WIT contract, with per-script Cargo features so each build targets one Unicode script (Latin, Cyrillic, Arabic, ...). Intended to be built once per script and shipped as a lazy-loaded WASM component the host fetches after `stringcheese-detect-script` (tier 0) classifies the input."
categories = ["text-processing", "internationalization", "wasm"]
keywords = ["language-detection", "whatlang", "wasm", "wit"]

[lib]
# Dual-target: `rlib` for Rust callers, `cdylib` for the WIT component
# build. One cdylib per feature-selected script.
crate-type = ["cdylib", "rlib"]

[features]
# One feature per Unicode script. Each feature turns on the
# per-script trigram tables under src/vendored/trigrams/profiles/
# — disabled scripts are not compiled in at all, so the resulting
# binary contains only the script(s) the caller asked for. See
# the release-size measurements in src/lib.rs's module docs.
default = ["latn"]
latn = []
cyrl = []
arab = []
hebr = []
grek = []
deva = []
hans = []
hant = []
hang = []
jpan = []

# `wit-component` opts into the WIT `Guest` implementation and the
# `export!` invocation that turns this crate into a standalone
# `tegmentum:lang-detect@0.2.0` WASM component. Off by default so
# the crate can be linked as a plain `rlib` sibling of other
# detect backends (e.g. by the `stringcheese-detect` umbrella)
# without every backend emitting the same exported symbols and
# tripping the linker with duplicate-export errors. Enable this
# only for the standalone-component build produced by
# `cargo component build`.
wit-component = ["dep:wit-bindgen-rt"]

[dependencies]
# whatlang's source is vendored under `src/vendored/` — see
# `LICENSE-WHATLANG` at the crate root for the upstream MIT notice
# and the module-level docs in `src/vendored/mod.rs` for the changes
# (profile split by script, feature gates on per-script alphabet
# tables). Runtime dep on whatlang is intentionally NOT taken so the
# per-script feature gates actually drop unused trigram tables at
# link time.
#
# whatlang's own runtime deps are copied here.
hashbrown = { version = "0.14", default-features = false, features = ["ahash"] }
once_cell = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
# Pulled in only when the `wit-component` feature is enabled — see the
# feature docs above. `optional = true` keeps it off the dependency
# tree for non-component wasm consumers, including the
# `stringcheese-detect` umbrella that links this crate as a plain
# `rlib` alongside the other detect backends.
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"], optional = true }

[package.metadata.component]
package = "tegmentum:stringcheese-detect-whatlang"

[package.metadata.component.target]
path = "../../wit"
world = "lang-detect"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
