[package]
name = "stringcheese-hi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hindi language pack for the StringCheese toolkit: ~130-word Devanagari stopword list, deliberately-conservative light Hindi suffix-stripping stemmer (gender/number markers and verb tense endings; fused postpositions deliberately omitted because they collide with common nominal endings), Devanagari-aware normalizer (Devanagari-digit folding and nukta stripping), whitespace-and-Devanagari-punctuation tokenizer (danda ।), and an IAST (International Alphabet of Sanskrit Transliteration) Devanagari to Latin transliteration phonetic hookup with inherent-vowel schwa handling. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["hindi", "devanagari", "stemmer", "iast", "stopwords"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The light
# Hindi stemmer builds owned `String` output, `Language::tokenize`
# hands back a `Box<dyn Iterator>`, the normalizer allocates, and the
# IAST transliterator returns an owned `String` key — all
# `alloc`-only. Without this feature the crate compiles down to the
# stopword slice and the module constants alone (enough to link
# against on embedded targets that only want the stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
