[package]
name = "stringcheese-icu-collation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Collation capability of the StringCheese ICU alternative. Wraps the existing `stringcheese-collate` UCA collator with locale-tailoring data from one or more `stringcheese-scud` collation packs and exposes it through the `stringcheese:icu-collation@0.1.0` WIT world. Phase 2 of the WIT-i18n subsystem (docs/design/wit-i18n.md § 8.2)."
categories = ["text-processing", "internationalization"]
keywords = ["collation", "icu", "unicode", "uca", "cldr"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-scud/std", "stringcheese-collate/std"]
# When enabled, the crate exposes the full collation-engine API
# (compare produces `Ordering`; sort_key produces owned `Vec<u8>`).
# Without this feature the crate compiles down to the pack-descriptor
# types alone.
alloc = ["stringcheese-scud/alloc", "stringcheese-collate/alloc"]

[dependencies]
stringcheese-scud = { workspace = true }
# The existing native collator implementation — used as the UCA
# oracle for the actual comparison, with pre-normalization applied
# per-pack before we hand strings to feruca. Phase 2 explicitly
# reuses rather than reimplementing.
stringcheese-collate = { workspace = true }

[dev-dependencies]
# `wit-parser` provides a strong "the WIT file parses cleanly" gate
# that does not need the wasm toolchain to be installed. Matches
# the `stringcheese-icu-case` crate's approach.
wit-parser = "0.230"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
