[package]
name = "comparand-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Benchmark suite and comparative-reporting harness for the Comparand sequence-comparison toolkit."
publish = false

[features]
default = ["std"]
std = []

[dependencies]
comparand-core = { workspace = true, features = ["std"] }
comparand-levenshtein = { workspace = true, features = ["std"] }
comparand-hamming = { workspace = true, features = ["std"] }
comparand-jaro = { workspace = true, features = ["std"] }
comparand-damerau = { workspace = true, features = ["std"] }
comparand-ngram = { workspace = true, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "levenshtein"
harness = false

[[bench]]
name = "hamming"
harness = false

[[bench]]
name = "jaro"
harness = false

[[bench]]
name = "damerau"
harness = false

[[bench]]
name = "ngram"
harness = false

[[bench]]
name = "batch"
harness = false

[lints]
workspace = true
