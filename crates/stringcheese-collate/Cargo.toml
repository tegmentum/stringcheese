[package]
name = "stringcheese-collate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Locale-aware collation for the StringCheese toolkit: Unicode Collation Algorithm ordering via `feruca` (lean UCA implementation), natural-order collation (`file2` < `file10`), and ASCII-fast-path variants. One `Collator` trait; every implementation composes cleanly with `slice.sort_by`. Design goal is the sensible-default 90% case; callers who need full CLDR-tailored variants swap in `icu_collator` under the same trait."
categories = ["text-processing", "internationalization"]
keywords = ["collation", "sorting", "uca", "unicode", "natural-sort"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
# Feruca is a leaner UCA implementation than the full icu_collator
# pull — ~200 KB of collation data vs. multi-MB. For callers who
# need CLDR-tailored variants (Vietnamese, Chinese pinyin, etc.),
# swapping in icu_collator behind the same `Collator` trait is a
# thin adapter, not a rewrite.
feruca = "0.12"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
