[package]
name = "stringcheese-tokenizer-tiktoken"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenAI tiktoken model tokenizer pack for the StringCheese toolkit — cl100k_base, p50k_base, r50k_base, o200k_base as SCUD-lite data on top of stringcheese-tokenizer-hf."
categories = ["text-processing"]
keywords = ["tokenizer", "tiktoken", "openai", "bpe", "cl100k"]
build = "build.rs"

# Bake a tiny corner of the crate root into the package so the layout doc
# and the data-directory README travel with any published copy.
include = [
    "src/**/*.rs",
    "build.rs",
    "data/README.md",
    "README.md",
    "Cargo.toml",
]

[features]
# `cl100k_base` is the most-used variant (GPT-3.5 / GPT-4 family) and
# ships by default so a caller adding this crate with no feature list
# gets the common case for free.
default = ["cl100k_base"]

# One feature per variant. Each pulls in a single embedded SCUD-lite
# pack — a caller paying for `p50k_base` alone does not embed the
# `cl100k_base` bytes.
cl100k_base = []
p50k_base = []
r50k_base = []
o200k_base = []

[dependencies]
stringcheese-tokenizer = { workspace = true, features = ["std"] }
stringcheese-tokenizer-hf = { workspace = true, features = ["std"] }

# Pure-Rust deflate decoder. `miniz_oxide` is the same decoder Rust's
# `backtrace` uses and needs no C shim, which is what makes it work on
# every `wasm32-*` target the workspace ships to.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[build-dependencies]
# The build script runs on the host toolchain and produces the embedded
# SCUD-lite packs. Same crate as the runtime, but here it's used for its
# `deflate_to_vec` encoder path.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
