[package]
name = "comparand-hamming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hamming distance for the Comparand sequence-comparison toolkit."
categories = ["algorithms", "text-processing", "no-std"]
keywords = ["hamming", "distance", "comparison", "wasm"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
# The only observable difference is that `LengthMismatch` implements
# `std::error::Error` — the kernel itself is pure `core` and does no
# allocation.
std = ["alloc", "comparand-core/std"]
# Present for symmetry with the rest of the workspace's crates so a
# no-std-plus-alloc build is a first-class configuration. Hamming's kernel
# does not itself allocate; the feature exists so callers with a uniform
# feature-flag matrix can turn it on without a special case.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
# Golden-case schema; test-only. `alloc` is enabled so property tests can
# use the exhaustive generators.
comparand-corpus = { workspace = true, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
