[package]
name = "stringcheese-en"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "English language pack for the StringCheese toolkit: ~150-word stopword list, Porter (1980) stemmer, simple word tokenizer, and Soundex phonetic hookup. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["english", "stemmer", "porter", "stopwords", "soundex"]
build = "build.rs"

# Ship the rules TOML in the crate package so downstream builds can
# re-run the generator against the shipped rules.
include = [
    "build.rs",
    "rules/**/*.toml",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The
# Porter stemmer builds owned `String` output, `Language::tokenize`
# hands back a `Box<dyn Iterator>`, and the Soundex adapter returns
# owned `String` keys — all `alloc`-only. Without this feature the
# crate compiles down to the stopword slice and the constants alone
# (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Ship the case-en.scud pack (the WIT-i18n Phase 1 case-mapping data
# for English). Adds a `case_data` module exposing `CASE_EN_SCUD:
# &'static [u8]` and a helper for constructing a
# `stringcheese_icu_case::CasePack`. Enabled by default — the pack is
# small (~1 KiB) and the whole point of the `case-scud` feature gate
# is to let embedded callers opt out on ROM-constrained targets.
#
# The `stringcheese-icu-case/alloc` toggle is included because the
# workspace declares `default-features = false` on the workspace dep
# (matches every other stringcheese-* crate) — without an explicit
# opt-in, the `CasePack` constructor helper would sit behind a
# feature the `case-scud` caller has no obvious way to enable.
case-scud = ["dep:stringcheese-icu-case", "stringcheese-icu-case/alloc"]
# Ship the collation-en.scud pack (the WIT-i18n Phase 2 collation
# tailoring data for English). Adds a `collation_data` module
# exposing `COLLATION_EN_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_collation::CollationPack`.
# Enabled by default — the pack is very small (under 100 bytes for
# English's DUCET-root behaviour with a hand-picked expansion for
# hyphenation-ignorable) and the whole point of the `collation-scud`
# feature gate is to let embedded callers opt out on ROM-constrained
# targets. The `stringcheese-icu-collation/alloc` toggle is included
# because the workspace declares `default-features = false` on the
# workspace dep.
collation-scud = ["dep:stringcheese-icu-collation", "stringcheese-icu-collation/alloc"]
# Ship the plural-en.scud pack (WIT-i18n Phase 3 plural-rule data
# for English cardinals and ordinals). Adds a `plural_data` module
# exposing `PLURAL_EN_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_plural::PluralPack`. Enabled by
# default — the pack is under 30 bytes. Requires the plural
# crate's `std` feature because plural classification uses `f64`
# transcendental methods (`trunc`, `abs`) that only exist on std.
plural-scud = ["dep:stringcheese-icu-plural", "stringcheese-icu-plural/std"]
# Ship the number-en.scud pack (WIT-i18n Phase 3 number-formatting
# data for English). Adds a `number_data` module exposing
# `NUMBER_EN_SCUD: &'static [u8]` and a helper for constructing a
# `stringcheese_icu_number::NumberPack`. Enabled by default — the
# pack is under 100 bytes. Requires the number crate's `std`
# feature — same rationale as `plural-scud`.
number-scud = ["dep:stringcheese-icu-number", "stringcheese-icu-number/std"]
# Ship the datetime-en.scud pack (WIT-i18n Phase 4 date/time-
# formatting data for English). Adds a `datetime_data` module
# exposing `DATETIME_EN_SCUD: &'static [u8]` and a helper for
# constructing a `stringcheese_icu_datetime::DateTimePack`. Enabled
# by default — the pack is roughly 300 bytes (patterns + month +
# weekday + AM/PM + era names). Requires the datetime crate's
# `std` feature — same rationale as `plural-scud`.
datetime-scud = ["dep:stringcheese-icu-datetime", "stringcheese-icu-datetime/std"]
# Enables the CLDR-tailored English collator backed by ICU4X's
# implementation of the Unicode Collation Algorithm. Adds roughly
# 40 KB of baked collation data plus the ICU4X collator, normalizer,
# and property crates to the build; opt-in so the default
# `stringcheese-en` build stays free of ICU4X. `icu_provider/sync`
# is enabled so the produced `Collator` is `Send + Sync` and can be
# named in a `static` — the language pack's collator is shared
# across threads through the [`Language::collator`] trait method.
# Requires `std` (ICU4X's baked-data path assumes it).
icu-collator = ["dep:icu_collator", "dep:icu_locid", "dep:icu_provider", "std"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# `icu_collator` — UCA implementation with per-locale tailoring.
# Optional; only pulled in when the `icu-collator` feature is on.
# Default features include `compiled_data`, which bakes the English
# collation table into the binary — this is the whole point of the
# opt-in feature. See `cldr_collator.rs` for the wrapper.
icu_collator = { version = "2.2", optional = true }
# `icu_locid` — the `locale!("en")` macro that names the CLDR locale
# passed to `Collator::try_new`. Same version family as the
# already-in-tree `icu_casemap` dependency (both at ICU4X 1.5).
icu_locid = { version = "1.5", optional = true }
# `icu_provider` with the `sync` feature. Enabling `sync` swaps
# ICU4X's internal `Rc`-based smart pointers for `Arc`s, which is
# what makes the resulting `Collator` `Send + Sync` — required for
# the `static ENGLISH_CLDR_COLLATOR` slot below and for the
# `Language::collator` trait's `Sync` bound. Only pulled in with
# `icu-collator`.
icu_provider = { version = "1.5", optional = true, default-features = false, features = ["sync"] }
# WIT-i18n case-mapping capability crate. Optional; only pulled in
# when the `case-scud` feature is enabled — pulls a small
# `CasePack` constructor helper into the crate's public surface so
# downstream users can hand the SCUD blob to a `CaseEngine` without
# reaching for `stringcheese-icu-case` directly.
stringcheese-icu-case = { workspace = true, optional = true }
# WIT-i18n collation capability crate. Optional; only pulled in when
# the `collation-scud` feature is enabled — pulls a small
# `CollationPack` constructor helper into the crate's public surface
# so downstream users can hand the SCUD blob to a `CollationEngine`
# without reaching for `stringcheese-icu-collation` directly.
stringcheese-icu-collation = { workspace = true, optional = true }
# WIT-i18n plural-rules capability crate. Optional; only pulled in
# when the `plural-scud` feature is enabled — pulls a small
# `PluralPack` constructor helper into the crate's public surface.
stringcheese-icu-plural = { workspace = true, optional = true }
# WIT-i18n number-formatting capability crate. Optional; only
# pulled in when the `number-scud` feature is enabled — pulls a
# small `NumberPack` constructor helper into the crate's public
# surface.
stringcheese-icu-number = { workspace = true, optional = true }
# WIT-i18n date/time-formatting capability crate. Optional; only
# pulled in when the `datetime-scud` feature is enabled — pulls a
# small `DateTimePack` constructor helper into the crate's public
# surface.
stringcheese-icu-datetime = { workspace = true, optional = true }

[build-dependencies]
# Build-time codegen for the pack's data-driven surface (stopwords,
# capability record). Runs in `build.rs`, emits code into `OUT_DIR`,
# never reaches the shipped binary — see
# `docs/design/language-architecture.md` § 1 for the rationale.
stringcheese-lang-gen = { workspace = true }
# Build-time codegen for the case-en.scud pack. Emits the SCUD blob
# into `$OUT_DIR/case-en.scud`; the crate's `case_data` module
# `include_bytes!`-es it back at compile time. `stringcheese-scud`
# is a build-dep (not a runtime dep) because the writer is only used
# during codegen — the shipped binary contains only the encoded
# blob, not the writer machinery.
stringcheese-scud = { workspace = true, features = ["alloc"] }
# Build-time re-use of the plural crate's PluralRuleId opcodes and
# per-locale helper functions (avoids re-encoding rule ids by
# their raw u8 in every language pack). Runtime dep is separately
# gated behind the `plural-scud` feature. Uses `std` here because
# build.rs always runs on the host with std available; downstream
# (runtime) callers still control std/no-std via the `plural-scud`
# feature's transitive deps.
stringcheese-icu-plural = { workspace = true, features = ["std"] }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
