[package]
name = "stringcheese-en"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "English language pack for the StringCheese toolkit: ~150-word stopword list, Porter (1980) stemmer, simple word tokenizer, and Soundex phonetic hookup. Implements stringcheese-lang::Language."
categories = ["text-processing", "internationalization"]
keywords = ["english", "stemmer", "porter", "stopwords", "soundex"]
build = "build.rs"

# Ship the rules TOML in the crate package so downstream builds can
# re-run the generator against the shipped rules.
include = [
    "build.rs",
    "rules/**/*.toml",
    "src/**/*.rs",
    "Cargo.toml",
]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "stringcheese-lang/std", "stringcheese-phonetic/std"]
# When enabled, the crate exposes its full public surface. The
# Porter stemmer builds owned `String` output, `Language::tokenize`
# hands back a `Box<dyn Iterator>`, and the Soundex adapter returns
# owned `String` keys — all `alloc`-only. Without this feature the
# crate compiles down to the stopword slice and the constants alone
# (enough to link against on embedded targets that only want the
# stopword table).
alloc = ["stringcheese-lang/alloc", "stringcheese-phonetic/alloc"]
# Enables the CLDR-tailored English collator backed by ICU4X's
# implementation of the Unicode Collation Algorithm. Adds roughly
# 40 KB of baked collation data plus the ICU4X collator, normalizer,
# and property crates to the build; opt-in so the default
# `stringcheese-en` build stays free of ICU4X. `icu_provider/sync`
# is enabled so the produced `Collator` is `Send + Sync` and can be
# named in a `static` — the language pack's collator is shared
# across threads through the [`Language::collator`] trait method.
# Requires `std` (ICU4X's baked-data path assumes it).
icu-collator = ["dep:icu_collator", "dep:icu_locid", "dep:icu_provider", "std"]

[dependencies]
stringcheese-lang = { workspace = true }
stringcheese-phonetic = { workspace = true }
# `icu_collator` — UCA implementation with per-locale tailoring.
# Optional; only pulled in when the `icu-collator` feature is on.
# Default features include `compiled_data`, which bakes the English
# collation table into the binary — this is the whole point of the
# opt-in feature. See `cldr_collator.rs` for the wrapper.
icu_collator = { version = "1.5", optional = true }
# `icu_locid` — the `locale!("en")` macro that names the CLDR locale
# passed to `Collator::try_new`. Same version family as the
# already-in-tree `icu_casemap` dependency (both at ICU4X 1.5).
icu_locid = { version = "1.5", optional = true }
# `icu_provider` with the `sync` feature. Enabling `sync` swaps
# ICU4X's internal `Rc`-based smart pointers for `Arc`s, which is
# what makes the resulting `Collator` `Send + Sync` — required for
# the `static ENGLISH_CLDR_COLLATOR` slot below and for the
# `Language::collator` trait's `Sync` bound. Only pulled in with
# `icu-collator`.
icu_provider = { version = "1.5", optional = true, default-features = false, features = ["sync"] }

[build-dependencies]
# Build-time codegen for the pack's data-driven surface (stopwords,
# capability record). Runs in `build.rs`, emits code into `OUT_DIR`,
# never reaches the shipped binary — see
# `docs/design/language-architecture.md` § 1 for the rationale.
stringcheese-lang-gen = { workspace = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
