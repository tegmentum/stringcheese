[package]
name = "stringcheese-lang-test"
# Never released. Held at 0.0.0 as a signal that the workspace-wide
# `version.workspace = true` sweep should skip this crate — it is a
# host for the multi-pack linkme integration test that lives at
# `tests/registry_integration.rs`, extracted out of `stringcheese-lang`
# to break the dev-dep cycle that used to block
# `cargo publish --dry-run --workspace` on the language packs. See
# `docs/publishing.md` for the topological-sort story.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Integration-test host for the stringcheese-lang registry (linkme distributed-slice sanity check across the shipped stringcheese-en / -de / -fr packs). Not published."
publish = false

[dependencies]

[dev-dependencies]
# Pulled in as dev-deps (not runtime deps) because this crate has no
# runtime surface — `src/lib.rs` is an empty shell. The only consumer
# of `stringcheese-lang` + `stringcheese-{en,de,fr}` in this crate is
# `tests/registry_integration.rs`, and dev-dependencies are the correct
# place for test-only deps. Sitting them here (rather than under
# `[dependencies]`) also keeps the crate's already-empty runtime dep
# graph strictly empty, so nothing links against these packs unless a
# test binary is being built.
#
# `default-features = true` (i.e. `std`, which pulls in `alloc`) is
# required for the integration test — the pack constants
# (`ENGLISH`, `GERMAN`, `FRENCH`) and the `Language` trait's
# `stem` / `tokenize` methods live behind the `alloc` gate.
stringcheese-lang = { workspace = true, default-features = true }
stringcheese-en = { workspace = true, default-features = true }
stringcheese-de = { workspace = true, default-features = true }
stringcheese-fr = { workspace = true, default-features = true }

[lints]
workspace = true
