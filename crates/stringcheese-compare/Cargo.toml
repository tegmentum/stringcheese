[package]
name = "stringcheese-compare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Comparison algorithms for the StringCheese toolkit: edit-distance metrics (Levenshtein, Hamming, Jaro/Jaro-Winkler, Damerau/OSA, LCS), set-similarity coefficients (Dice, Jaccard, Cosine, Overlap), n-gram representations, substring-search kernels (Rabin-Karp, KMP, Boyer-Moore, Aho-Corasick, Horspool, Two-Way), and MinHash sketches."
categories = ["algorithms", "text-processing", "no-std"]
keywords = ["string-comparison", "edit-distance", "similarity", "search", "minhash"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
# `std` gates:
#   * Damerau's `HashMap`-backed production kernel and `DamerauWorkspace`
#     (`damerau/production.rs`, cross-variant property tests).
#   * Set-similarity's `Cosine` (uses `f64::sqrt`).
#   * N-gram's `l2_norm` / `normalize_l2` on `GramVector` (`f64::sqrt`).
#   * MinHash's weighted CWS sketch (`f64::ln`, `f64::exp`, `f64::floor`).
std   = ["alloc", "stringcheese-core/std"]
# When enabled, the crate exposes its heap-allocating public surface. Every
# dynamic-programming kernel and every representation type requires this;
# without it the crate compiles as an empty no-alloc surface for embedded
# builds that only need to link against the substrate crates.
alloc = ["stringcheese-core/alloc"]
# When enabled, the byte-slice-oriented Levenshtein entry point transparently
# swaps in a SIMD-accelerated backend (Myers 1999 bit-parallel algorithm,
# dispatched at run time to AVX2 / SSE2 on x86_64 or NEON on aarch64). SIMD
# is opt-in because it needs runtime CPU-feature detection — that pulls in
# `std::arch::is_*_feature_detected!`, which lives in `std`, not `core` or
# `alloc`. Default builds keep the scalar rolling-rows kernel intact so the
# `no_std` and `alloc`-only configurations are unaffected.
simd = ["std"]

[dependencies]
stringcheese-core = { workspace = true }

[dev-dependencies]
# Golden-case schema (workspace-inherited so version and path stay in sync
# with the rest of the workspace); test-only, never linked into a normal
# library build. `alloc` is enabled so property tests can use the
# exhaustive generators and the golden-case schema types.
stringcheese-corpus = { workspace = true, features = ["alloc"] }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
