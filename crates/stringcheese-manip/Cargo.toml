[package]
name = "stringcheese-manip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "String manipulation for the StringCheese toolkit: inspect, trim, case, split, join, replace, normalize, pad, slice, find, escape, quote, lines, template. Unicode-aware and allocation-conscious; three modules ship in v0.1 (inspect, trim, case), remaining modules land in subsequent releases."
categories = ["text-processing", "no-std"]
keywords = ["string", "text", "manipulation", "no-std", "wasm"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = [
    "alloc",
    "stringcheese-core/std",
    "stringcheese-unicode/std",
    "stringcheese-compare/std",
]
# When enabled, the crate may use heap-allocating types from `alloc`.
# Grapheme-aware inspect helpers, the owned `String`-returning case
# transformations, and the `Trim` configured operation all require this
# feature. Without it the crate exposes only the borrowing zero-alloc
# subset (byte / scalar inspects and the trim free functions).
alloc = [
    "stringcheese-core/alloc",
    "stringcheese-unicode/alloc",
    "stringcheese-compare/alloc",
]

[dependencies]
stringcheese-core = { workspace = true }
# `stringcheese-unicode` is the sanctioned delegation target for grapheme
# iteration and case folding — `stringcheese-manip` never depends on the
# ICU / unicode-* crates directly, so all Unicode data lives in one place.
stringcheese-unicode = { workspace = true }
# `stringcheese-compare::search` provides the substring-search kernels;
# `replace::replace_many` uses Aho-Corasick to run many needle→replacement
# substitutions in a single pass over the input.
stringcheese-compare = { workspace = true }

[dev-dependencies]


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
