[package]
name = "stringcheese-manip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "String manipulation for the StringCheese toolkit: inspect, trim, case, split, join, replace, normalize, pad, slice, find, escape, quote, lines, template. Unicode-aware and allocation-conscious; 14 of 15 modules ship in v0.1 (only the pipeline transformation IR remains scaffold and lands in a subsequent release)."
categories = ["text-processing", "no-std"]
keywords = ["string", "text", "manipulation", "no-std", "wasm"]

[features]
default = ["std", "line-breaking"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = [
    "alloc",
    "stringcheese-core/std",
    "stringcheese-unicode/std",
    "stringcheese-compare/std",
]
# When enabled, the crate may use heap-allocating types from `alloc`.
# Grapheme-aware inspect helpers, the owned `String`-returning case
# transformations, and the `Trim` configured operation all require this
# feature. Without it the crate exposes only the borrowing zero-alloc
# subset (byte / scalar inspects and the trim free functions).
alloc = [
    "stringcheese-core/alloc",
    "stringcheese-unicode/alloc",
    "stringcheese-unicode/word-segmentation",
    "stringcheese-unicode/sentence-segmentation",
    "stringcheese-compare/alloc",
]
# Enables the [`wrap`] module — word-wrap and reflow at UAX #14 line-
# break opportunities. Forwards to `stringcheese-unicode`'s
# `line-breaking` feature (which pulls in the `unicode-linebreak`
# `Line_Break` property table, ~22 KB in `wasm-opt -Oz`) and additionally
# pulls in `unicode-width` for Unicode East Asian Width-aware column
# measurement so a terminal wrapper sees CJK ideographs as double-width
# and combining marks as zero-width. `unicode-width` is a small pure-
# data crate (~15 KB `wasm-opt -Oz`) with no transitive deps beyond
# core. Requires `alloc` because both the wrapping algorithms and the
# returned `Vec<String>` / `String` outputs are heap-typed.
line-breaking = [
    "alloc",
    "stringcheese-unicode/line-breaking",
    "dep:unicode-width",
]

[dependencies]
stringcheese-core = { workspace = true }
# `stringcheese-unicode` is the sanctioned delegation target for grapheme
# iteration and case folding — `stringcheese-manip` never depends on the
# ICU / unicode-* crates directly, so all Unicode data lives in one place.
stringcheese-unicode = { workspace = true }
# `stringcheese-compare::search` is the sanctioned delegation target for
# substring-search kernels (KMP, Aho-Corasick, ...) — `stringcheese-manip`
# routes `find`, `find_all`, `find_any`, and `replace::replace_many`
# through those algorithms rather than reimplementing them (Aho-Corasick
# in particular lets `replace_many` run many needle→replacement
# substitutions in one linear pass).
stringcheese-compare = { workspace = true }
# `unicode-width` — Unicode East Asian Width lookup used by the [`wrap`]
# module's column-width measurement so a terminal word-wrapper sees CJK
# ideographs as double-width and combining marks as zero-width. Gated on
# the `line-breaking` feature — an ASCII-only caller who only reaches
# the byte / scalar / grapheme APIs pays nothing for it. `no_std`
# compatible, no transitive deps beyond `core`.
unicode-width = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
# `criterion` — bench harness for the `manip` bench (see
# `benches/manip.rs`). Pulled from the workspace-level dep so every
# bench-adopting crate tracks the same 0.5 line. `html_reports` is the
# only non-default feature we ask for — matches the shape used by
# `stringcheese-tokenizer-hf-bench` so the two bench crates' criterion
# outputs live in the same directory layout.
criterion = { workspace = true }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

# `manip` bench — breadth-first criterion coverage of 12 hot public
# operations across three input sizes and two Unicode flavors. See
# `benches/manip.rs`'s module docs for the baseline numbers and the
# rationale behind each group. `harness = false` gives criterion its own
# main; the bench compiles under `--all-features` so the wrap module's
# UAX-#14 kernels stay reachable if a later revision adds a wrap group.
[[bench]]
name = "manip"
harness = false

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
