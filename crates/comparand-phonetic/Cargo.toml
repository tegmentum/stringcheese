[package]
name = "comparand-phonetic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Phonetic encoding and matching algorithms (Soundex, Metaphone, NYSIIS, and multilingual packs) for Comparand."
categories = ["algorithms", "text-processing", "internationalization"]
keywords = ["comparison", "phonetic", "soundex", "metaphone", "nysiis"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Implies `alloc`.
std = ["alloc", "comparand-core/std"]
# When enabled, the crate exposes its full public surface. Every phonetic
# encoder returns owned `String`s (or a small struct containing them), so
# the entire public surface is behind the `alloc` feature; without it the
# crate compiles as an empty no-alloc surface for embedded builds that
# only need to link against the substrate crates.
alloc = ["comparand-core/alloc"]

[dependencies]
comparand-core = { workspace = true }

[dev-dependencies]
# Golden-case schema; test-only. `alloc` is enabled so the golden case
# fixtures and property tests can share ownership machinery.
comparand-corpus = { workspace = true, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
