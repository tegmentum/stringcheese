[package]
name = "stringcheese-align"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Global (Needleman-Wunsch) and local (Smith-Waterman) sequence alignment with linear and affine gap penalties for the StringCheese toolkit."
categories = ["algorithms", "text-processing", "no-std"]
keywords = ["alignment", "needleman-wunsch", "smith-waterman", "sequence"]

[features]
default = ["std"]
# When enabled, the crate uses the standard library. Also implies `alloc`.
std = ["alloc", "stringcheese-core/std"]
# When enabled, the alignment kernels, the workspace, and the edit-script
# reconstruction are exposed. The `scoring` module (ScoringScheme trait,
# LinearGap, AffineGap) is available even without alloc.
alloc = ["stringcheese-core/alloc"]

[dependencies]
stringcheese-core = { workspace = true }

[dev-dependencies]
stringcheese-corpus = { workspace = true, features = ["alloc"] }


# `proptest` gated off wasm — its transitive `wait-timeout` dep is
# `#[cfg(unix)]` / `#[cfg(windows)]` only, with no wasm branch, so
# leaving it in `[dev-dependencies]` breaks the wasm-runtime CI job's
# `cargo test --target wasm32-wasip1`. Host tests still pick up
# proptest through this target-gated section; wasm test runs simply
# skip the property-test modules (they're gated on the same predicate).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true
