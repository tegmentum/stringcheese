[package]
name = "comparand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rigorous sequence comparison for Rust and WebAssembly — distance, similarity, alignment, phonetic, n-gram, fingerprinting, and chunking algorithms."
categories = ["algorithms", "text-processing"]
keywords = ["comparison", "distance", "similarity", "levenshtein", "phonetic"]

[features]
default = ["std"]
std = [
    "comparand-core/std",
    "comparand-levenshtein/std",
    "comparand-hamming/std",
    "comparand-jaro/std",
    "comparand-damerau/std",
    "comparand-ngram/std",
    "comparand-unicode/std",
    "comparand-phonetic/std",
    "comparand-set-similarity/std",
    "comparand-lcs/std",
]
alloc = [
    "comparand-core/alloc",
    "comparand-levenshtein/alloc",
    "comparand-hamming/alloc",
    "comparand-jaro/alloc",
    "comparand-damerau/alloc",
    "comparand-ngram/alloc",
    "comparand-unicode/alloc",
    "comparand-phonetic/alloc",
    "comparand-set-similarity/alloc",
    "comparand-lcs/alloc",
]

[dependencies]
comparand-core = { workspace = true }
comparand-levenshtein = { workspace = true }
comparand-hamming = { workspace = true }
comparand-jaro = { workspace = true }
comparand-damerau = { workspace = true }
comparand-ngram = { workspace = true }
comparand-unicode = { workspace = true }
comparand-phonetic = { workspace = true }
comparand-set-similarity = { workspace = true }
comparand-lcs = { workspace = true }

[lints]
workspace = true
