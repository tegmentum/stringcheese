[package]
name = "stringcheese-tokenizer-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reference WebAssembly component packaging for the StringCheese tokenizer subsystem. Wraps a `stringcheese-tokenizer-hf::BpeTokenizer` behind the shared tegmentum:tokenizer@0.1.0 WIT contract, feature-gated so a component-model host can load the tokenizer through the standard `world tokenizer-provider` export while callers of the plain `rlib` avoid any wit-bindgen-rt symbol collisions."
categories = ["text-processing", "wasm"]
keywords = ["tokenizer", "bpe", "wasm", "wit", "component-model"]

[lib]
# Dual-target: `rlib` for Rust callers (unit tests, host-side embedding),
# `cdylib` for the WIT component build produced by
# `cargo build --target wasm32-wasip1 --features wit-component`.
crate-type = ["cdylib", "rlib"]

[features]
# `std` is not required for the reference tokenizer construction — the
# built-in hand-crafted BPE vocab embedded in `src/lib.rs` is
# `alloc`-only. `std` is enabled by default for parity with the rest of
# the tokenizer subsystem; a `--no-default-features` build with
# `--features alloc` compiles the same shape without the standard
# library.
default = ["std"]
std = ["alloc", "stringcheese-tokenizer/std", "stringcheese-tokenizer-hf/std"]
alloc = ["stringcheese-tokenizer/alloc", "stringcheese-tokenizer-hf/alloc"]

# `wit-component` opts into the WIT `Guest` implementation and the
# `export!` invocation that turns this crate into a standalone
# `tegmentum:tokenizer@0.1.0` WASM component. Off by default so the
# crate can be linked as a plain `rlib` sibling of the other
# tokenizer crates without every backend emitting the same exported
# symbols and tripping the linker with duplicate-export errors —
# matches the pattern used by `stringcheese-detect-{script,whatlang,
# lingua}` for their tegmentum:lang-detect exports. Enable this only
# for the standalone-component build produced by
# `cargo build --target wasm32-wasip1 --features wit-component`.
wit-component = ["std", "dep:wit-bindgen-rt"]

[dependencies]
stringcheese-tokenizer = { workspace = true }
stringcheese-tokenizer-hf = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Pulled in only when the `wit-component` feature is enabled — see the
# feature docs above. `optional = true` keeps it off the dependency
# tree for non-component wasm consumers (e.g. any downstream that
# links this crate as a plain `rlib` alongside other tokenizer
# backends).
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"], optional = true }

[dev-dependencies]
# `wit-parser` gives a strong "the WIT file parses cleanly" gate that
# does not require the wasm toolchain to be present. The unit test in
# `src/lib.rs` reads the shipped WIT source and asserts the parser
# accepts it, so a change to the WIT that breaks parseability surfaces
# on host `cargo test` before the component build ever runs.
wit-parser = "0.230"

# `wasmtime` drives the in-process component runtime the smoke tests
# in `tests/component_smoke.rs` invoke each of the four WIT exports
# through. The dep is dev-only (never on the runtime crate graph),
# feature-pinned to just the bits the tests need: `runtime` +
# `cranelift` for a JIT-backed executor, `component-model` for the
# Component-Model APIs (bindgen! macro, `Component`, `Linker`) that
# replace the pre-Phase-8 shell-out to `wasmtime run --invoke`
# (wasmtime 20+ removed --invoke for components). The `async`, `cache`,
# `pooling-allocator`, `parallel-compilation` (rayon), `coredump`,
# `debug-builtins`, `profiling`, `gc`, `threads`, `wat`, `addr2line`,
# `demangle` defaults are dropped — none of them are load-bearing for
# a synchronous "load .wasm, call four functions, assert on the
# returned typed values" test.
wasmtime = { version = "46", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

# Companion crate that ships the WASI preview2 host implementations
# behind `add_to_linker_sync`. The reference tokenizer component does
# no I/O of its own, but the wasip1 -> wasip2 adapter applied at
# componentize time introduces a `wasi:*@0.2.x` import surface that
# the linker must satisfy before `instantiate` will succeed. Version
# pinned in lockstep with `wasmtime` (both share the 46.x wasi:@0.2.12
# baseline the CI's downloaded reactor adapter emits — bumped from
# the earlier 26.x/wasi:@0.2.1 pair to close the 19-advisory wasmtime
# advisory backlog, including RUSTSEC-2026-0095 and RUSTSEC-2026-0096
# critical-severity sandbox-escape entries).
wasmtime-wasi = { version = "47", default-features = false }

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
