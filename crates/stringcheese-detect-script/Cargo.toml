[package]
name = "stringcheese-detect-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tier-0 script classifier for the StringCheese language-detection stack. Scans text for Unicode-block membership and returns the dominant ISO 15924 script code. Zero-dependency; small enough (~5KB WASM after strip) to be always resident in a browser session as the bootstrap step before per-script language detection loads."
categories = ["text-processing", "internationalization", "wasm"]
keywords = ["language-detection", "script", "iso15924", "unicode", "wasm"]

[lib]
# Dual-target: `rlib` for Rust callers linking directly, `cdylib` for
# `wasm-tools component new` to consume when producing the WIT
# component that hosts load at runtime.
crate-type = ["cdylib", "rlib"]

[features]
# `wit-component` opts into the WIT `Guest` implementation and the
# `export!` invocation that turns this crate into a standalone
# `tegmentum:lang-detect@0.2.0` WASM component. Off by default so
# the crate can be linked as a plain `rlib` sibling of other detect
# backends (e.g. by the `stringcheese-detect` umbrella) without
# every backend emitting the same exported symbols and tripping the
# linker with duplicate-export errors. Enable this only for the
# standalone-component build produced by `cargo component build`.
# Meaningful only on wasm targets — the `wit-bindgen-rt` dep is
# further scoped to `cfg(target_family = "wasm")` below, and the
# `mod wit;` gate keys off `all(target_family = "wasm", feature)`.
wit-component = ["dep:wit-bindgen-rt"]

[dependencies]

# `wit-bindgen-rt` is only needed for the WIT Guest impl compiled
# into the WASM component. Native `rlib` consumers never see it —
# the target-gate keeps it off the dependency tree on host builds
# (including this crate's own `cargo test`), so the tier-0 story
# stays "no extra runtime cost" outside the component build. The
# `wit-component` feature further scopes it so even a wasm build
# without the feature — e.g. the crate linked as an `rlib` into
# the `stringcheese-detect` umbrella's wasm test binary — skips
# the dep and emits no WIT export symbols.
[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"], optional = true }

# `cargo-component` reads this stanza to locate the WIT world. The
# workspace-root `wit/` directory is the canonical schema shared with
# `stringcheese-detect-whatlang` (tier 1) and every downstream
# component that implements the same detection contract.
[package.metadata.component]
package = "tegmentum:stringcheese-detect-script"

[package.metadata.component.target]
path = "../../wit"
world = "lang-detect"

[package.metadata.docs.rs]
# Render on docs.rs with every feature exposed. crates.io / docs.rs
# defaults to `--default-features` only, which hides the majority of
# this crate's surface (feature-gated ICU backends, SCUD packs, wasm
# component wrappers, opt-in engines, and so on). Enumerating a
# specific `features = [...]` set is unnecessary because none of the
# stringcheese feature axes are mutually exclusive — `all-features`
# builds the full public API.
all-features = true
# Pin the target so docs.rs does not attempt speculative wasm32
# builds it can't satisfy (e.g. `wasm32-unknown-unknown` for crates
# that transitively pull `std`-only deps, or the `wasm32-wasip1`
# component builds gated behind `wit-component` features).
targets = ["x86_64-unknown-linux-gnu"]
# Enable the conventional `docsrs` cfg so per-crate
# `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]` badges resolve.
# No crate has been retrofitted with such gates in this pass — this
# arg is a forward-compatibility hook so the metadata does not have
# to be touched again when the first crate adopts the pattern.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
